<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnetism — Interactive</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8f5;color:#17211b;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1120px,96vw);margin:22px auto 30px}
h1{margin:0 0 5px;font-size:clamp(28px,4vw,42px)}
.intro{margin:0 0 16px;color:#59645d}
.stage{background:#fff;border:1px solid #dce3dc;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(20,35,25,.06)}
canvas{display:block;width:100%;height:min(62vw,610px);min-height:450px}
.controls{padding:17px 20px 20px;border-top:1px solid #e5e9e5}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
input{width:min(430px,72vw)}
button{padding:10px 15px;border:1px solid #cfd8d0;background:white;border-radius:10px;font-weight:bold;cursor:pointer}
.read{margin-top:12px;background:#f1f5f1;border-radius:10px;padding:11px 13px;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<h1>Magnetism</h1>
<p class="intro">Increase the magnet's strength and watch magnetic materials move toward it.</p>
<div class="stage">
<canvas id="c"></canvas>
<div class="controls">
<div class="row">
<label for="strength"><b>Magnet strength</b></label>
<input id="strength" type="range" min="0" max="100" value="0">
<span id="sv"><b>0</b></span>
<button id="reset">Reset</button>
</div>
<div class="read" id="read">Strength is 0: the magnet has no pulling effect in this model. Iron and steel stay far away.</div>
</div>
</div>
</div>

<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
const slider=document.getElementById("strength"),sv=document.getElementById("sv");
const read=document.getElementById("read"),reset=document.getElementById("reset");
let W=900,H=520,D=1,drag=false,last=performance.now();

const items=[
 {name:"Iron",baseY:.36,x:.82,targetOffset:0,magnetic:true},
 {name:"Steel",baseY:.53,x:.82,targetOffset:0,magnetic:true},
 {name:"Wood",baseY:.70,x:.82,magnetic:false},
 {name:"Plastic",baseY:.84,x:.82,magnetic:false}
];

function resize(){
 const r=c.getBoundingClientRect();
 D=Math.min(2,devicePixelRatio||1);
 W=Math.max(700,r.width); H=Math.max(450,r.height);
 c.width=W*D;c.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

function magnetX(){return W*.29}
function magnetY(){return H*.58}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function drawMagnet(mx,my){
 ctx.save();
 ctx.translate(mx,my);
 ctx.shadowBlur=16;ctx.shadowColor="rgba(20,30,25,.16)";
 ctx.fillStyle="#c94747";ctx.fillRect(-58,-31,58,62);
 ctx.fillStyle="#4c79ad";ctx.fillRect(0,-31,58,62);
 ctx.shadowBlur=0;
 ctx.strokeStyle="#3f4b46";ctx.lineWidth=2;ctx.strokeRect(-58,-31,116,62);
 ctx.fillStyle="#fff";ctx.font="bold 19px Arial";
 ctx.textAlign="center";ctx.fillText("N",-29,7);ctx.fillText("S",29,7);
 ctx.restore();
}

function drawField(mx,my,strength){
 if(strength<=0)return;
 const maxR=80+strength*2.2;
 ctx.save();
 ctx.strokeStyle="rgba(67,105,148,.28)";
 ctx.lineWidth=2;
 for(let i=0;i<7;i++){
   const rx=75+i*maxR/10;
   const ry=45+i*maxR/16;
   ctx.beginPath();
   ctx.ellipse(mx,my,rx,ry,0,0,Math.PI*2);
   ctx.stroke();
 }
 // directional arrows, more visible as strength rises
 ctx.fillStyle="rgba(67,105,148,.65)";
 const count=2+Math.floor(strength/30);
 for(let i=0;i<count;i++){
   const a=-1.1+(2.2*i/(count-1||1));
   const x=mx+Math.cos(a)*(maxR*.55);
   const y=my+Math.sin(a)*(maxR*.55);
   ctx.save();ctx.translate(x,y);ctx.rotate(a);
   ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-10,-5);ctx.lineTo(-10,5);ctx.closePath();ctx.fill();
   ctx.restore();
 }
 ctx.restore();
}

function drawBar(item,x,y,magnetic){
 const w=116,h=34;
 ctx.save();ctx.translate(x,y);
 ctx.shadowBlur=magnetic?10:5;
 ctx.shadowColor=magnetic?"rgba(60,85,100,.20)":"rgba(30,40,35,.12)";
 if(item.name==="Iron"||item.name==="Steel"){
   ctx.fillStyle=item.name==="Iron"?"#aeb6b9":"#8e999d";
   ctx.strokeStyle="#4f5b59";
   ctx.lineWidth=2;
   ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeRect(-w/2,-h/2,w,h);
 }else{
   ctx.fillStyle=item.name==="Wood"?"#b98959":"#d9e3e8";
   ctx.strokeStyle="#65716b";ctx.lineWidth=2;
   ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,6);ctx.fill();ctx.stroke();
 }
 ctx.fillStyle="#25312b";ctx.font="bold 14px Arial";ctx.textAlign="center";ctx.fillText(item.name,0,5);
 ctx.restore();
}

function draw(){
 const now=performance.now(),dt=Math.min(.035,(now-last)/1000);last=now;
 const s=+slider.value;
 const mx=magnetX(),my=magnetY();
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#fbfcfa";ctx.fillRect(0,0,W,H);

 // Labels
 ctx.fillStyle="#59645d";ctx.font="bold 13px Arial";ctx.textAlign="left";
 ctx.fillText("MAGNETIC FIELD",W*.055,H*.10);
 ctx.font="13px Arial";ctx.fillText("Stronger magnet → stronger field",W*.055,H*.10+21);

 drawField(mx,my,s);
 drawMagnet(mx,my);

 // Objects: iron/steel are pulled toward the magnet. Wood/plastic stay fixed.
 items.forEach(item=>{
   const fixedX=W*item.x;
   const targetX=mx+92; // stops almost against the magnet
   const pull=s/100;
   const desired=item.magnetic ? fixedX+(targetX-fixedX)*pull : fixedX;
   // speed increases strongly with magnet strength
   const speed=(item.magnetic ? (.55 + 4.2*pull) : 0);
   item.xpx ??= fixedX;
   item.xpx += (desired-item.xpx)*Math.min(1,dt*speed*3.0);
   // At maximum strength, let them finish very close to magnet.
   if(s>=99 && item.magnetic)item.xpx += (targetX-item.xpx)*Math.min(1,dt*5);
   drawBar(item,item.xpx,H*item.baseY,item.magnetic && s>0);
 });

 // small gap/connection cue when nearly attached
 if(s>78){
   items.filter(x=>x.magnetic).forEach(item=>{
     if(Math.abs(item.xpx-(mx+92))<18){
       ctx.strokeStyle="rgba(67,105,148,.7)";ctx.lineWidth=3;
       ctx.beginPath();ctx.moveTo(mx+58,H*item.baseY);ctx.lineTo(item.xpx-58,H*item.baseY);ctx.stroke();
     }
   });
 }

 // Bottom observation
 if(s===0){
   read.textContent="Strength is 0: iron and steel stay far away. Wood and plastic also stay where they are.";
 }else if(s<30){
   read.textContent="Weak magnet: iron and steel begin moving slowly toward the magnet. Wood and plastic do not move.";
 }else if(s<70){
   read.textContent="Stronger magnet: iron and steel move closer. The stronger the field, the stronger the pull.";
 }else if(s<95){
   read.textContent="Strong magnet: iron and steel are pulled quickly toward the magnet. Wood and plastic are unaffected.";
 }else{
   read.textContent="Maximum strength: iron and steel are pulled almost against the magnet. Wood and plastic remain far away.";
 }
 requestAnimationFrame(draw);
}

slider.addEventListener("input",()=>{
 sv.textContent=slider.value;
});
reset.addEventListener("click",()=>{
 slider.value=0;sv.textContent="0";
 items.forEach(item=>item.xpx=W*item.x);
});
sv.textContent="0";items.forEach(item=>item.xpx=W*item.x);draw();
</script>
</body>
</html>
