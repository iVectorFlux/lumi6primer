<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heat & Temperature</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#17211b;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1100px,96vw);margin:22px auto 30px}h1{margin:0 0 6px;font-size:clamp(27px,4vw,42px)}
.intro{margin:0 0 16px;color:#58635b}.stage{background:white;border:1px solid #dce3dc;border-radius:18px;overflow:hidden}
canvas{display:block;width:100%;height:min(58vw,570px);min-height:390px;background:#fbfcfa}
.controls{padding:16px 20px 20px;border-top:1px solid #e5e9e5}.row{display:flex;gap:18px;align-items:end;flex-wrap:wrap}
.control{flex:1 1 320px}label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:7px}
input{width:100%;accent-color:#b65c38}button{border:1px solid #cfd8d0;background:#fff;padding:10px 15px;border-radius:10px;font-weight:700;cursor:pointer}
.readout{margin-top:14px;padding:11px 13px;border-radius:10px;background:#f1f5f1;font-weight:700}
</style>
</head>
<body><div class="wrap">
<h1>Heat & Temperature</h1>
<p class="intro">Make one object hotter than the other. Watch heat move from the hotter object to the cooler one.</p>
<div class="stage"><canvas id="c"></canvas><div class="controls"><div class="row">
<div class="control"><label><span>Temperature difference</span><span id="v">Large</span></label>
<input id="temp" type="range" min="0" max="100" value="75"></div><button id="reset">Reset</button>
</div><div class="readout" id="r"></div></div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),sl=document.getElementById('temp'),vl=document.getElementById('v'),rd=document.getElementById('r');
let W=900,H=500,D=1,t=0;
function size(){let q=c.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=Math.max(700,q.width);H=Math.max(390,q.height);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function upd(){let n=+sl.value;vl.textContent=n<10?'Same':n<40?'Small':n<70?'Medium':'Large';rd.textContent=n<10?'Both objects are nearly the same temperature, so there is almost no net heat transfer.':n<40?'A small temperature difference causes slower heat transfer from hot to cold.':'Heat is moving from the hotter object to the cooler object.'}sl.oninput=upd;document.getElementById('reset').onclick=()=>{sl.value=75;upd()};upd();
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function draw(){
 x.clearRect(0,0,W,H);x.fillStyle='#fbfcfa';x.fillRect(0,0,W,H);
 let v=+sl.value/100, hot=92+v*48,cold=92,y=H*.40,bw=Math.min(260,W*.27),bh=150,L=W*.23-bw/2,R=W*.77-bw/2,m=y+bh/2;
 x.strokeStyle='#d9dfda';x.lineWidth=2;x.beginPath();x.moveTo(L+bw,m);x.lineTo(R,m);x.stroke();
 if(v>.03){x.strokeStyle='#c86a3c';x.fillStyle='#c86a3c';x.lineWidth=4;
  for(let i=0;i<3+Math.round(v*2);i++){let p=(t*(.18+v*.18)+i/(3+Math.round(v*2)))%1,q=L+bw+15+p*(R-L-bw-30);
   x.beginPath();x.moveTo(q-13,m);x.lineTo(q+13,m);x.stroke();x.beginPath();x.moveTo(q+13,m);x.lineTo(q+4,m-7);x.lineTo(q+4,m+7);x.closePath();x.fill()}
  x.font='bold 15px Arial';x.fillText('heat moves →',W/2-45,m-18)}
 function obj(px,grad,label,val){let g=x.createLinearGradient(px,y,px+bw,y+bh);g.addColorStop(0,grad[0]);g.addColorStop(1,grad[1]);x.fillStyle=g;rr(px,y,bw,bh,22);x.fill();
  x.fillStyle='rgba(255,255,255,.75)';for(let rrw=0;rrw<4;rrw++)for(let cc=0;cc<6;cc++){let bx=px+34+cc*(bw-68)/5,by=y+48+rrw*32,sp=val>110?5:3,dx=Math.sin(t*sp+rrw*1.7+cc)*2.3,dy=Math.cos(t*sp+cc)*1.4;x.beginPath();x.arc(bx+dx,by+dy,4,0,7);x.fill()}
  x.fillStyle='#fff';x.font='bold 19px Arial';x.fillText(label,px+24,y+35);x.font='bold 17px Arial';x.fillText(Math.round(val)+'°',px+24,y+bh-24)}
 obj(L,['#eaa17d','#bd4f32'],'HOTTER',hot);obj(R,['#a9cbe1','#5d91b8'],'COOLER',cold);
 x.fillStyle='#56625a';x.font='14px Arial';x.fillText('faster particle motion',L+bw/2-65,y+bh+28);x.fillText('slower particle motion',R+bw/2-65,y+bh+28);
 x.fillStyle='#253229';x.font='bold 17px Arial';x.fillText('Heat flows from hotter → cooler.',W/2-135,H-28);
 t+=.016;requestAnimationFrame(draw)}
draw();
</script></body></html>
