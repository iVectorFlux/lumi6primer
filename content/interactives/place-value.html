<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Value</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#182033;
}
.app{
  max-width:1080px;
  margin:0 auto;
  padding:28px 24px 40px;
}
h1{font-size:28px;margin:0 0 6px}
.subtitle{margin:0 0 24px;color:#697386;font-size:15px}

.card{
  background:#fff;
  border:1px solid #e4e7ee;
  border-radius:22px;
  padding:28px;
  box-shadow:0 6px 24px rgba(25,35,60,.05);
}

/* Main number */
.number-area{text-align:center}
.number{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:8px;
  min-height:112px;
}
.digit-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.digit{
  width:78px;
  height:92px;
  border:2px solid #dce1eb;
  border-radius:16px;
  background:#fff;
  font-size:52px;
  font-weight:700;
  color:#182033;
  cursor:pointer;
  transition:.15s;
}
.digit:hover{transform:translateY(-2px);border-color:#9aa5ba}
.digit.selected{
  border-color:#4e6ed7;
  background:#eef2ff;
  box-shadow:0 3px 0 #dbe2ff;
}
.place{
  font-size:12px;
  color:#7b8494;
  min-height:15px;
}
.equals{
  font-size:34px;
  color:#a2aaba;
  padding-bottom:27px;
}
.value-line{
  margin:18px 0 8px;
  font-size:18px;
  color:#4f596d;
}
.value-line strong{color:#4e6ed7;font-size:24px}

/* Place value strip */
.breakdown{
  margin-top:30px;
  border-top:1px solid #edf0f4;
  padding-top:24px;
}
.breakdown-title{
  text-align:center;
  font-size:14px;
  color:#697386;
  margin-bottom:15px;
}
.tiles{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.tile{
  border-radius:14px;
  padding:14px 10px;
  text-align:center;
  background:#f7f8fb;
  border:1px solid #eceef3;
  transition:.15s;
}
.tile.active{
  background:#eef2ff;
  border-color:#aebbf0;
}
.tile .digit-small{font-size:26px;font-weight:700}
.tile .place-small{font-size:12px;color:#7b8494;margin:3px 0}
.tile .amount{font-size:14px;font-weight:700}

/* Manipulation */
.controls{
  margin-top:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.control-label{font-size:14px;color:#697386}
input[type=range]{
  width:min(520px,65vw);
  accent-color:#4e6ed7;
  cursor:pointer;
}
.btn{
  border:1px solid #dce1eb;
  background:#fff;
  color:#263047;
  border-radius:10px;
  padding:9px 13px;
  font-weight:600;
  cursor:pointer;
}
.btn:hover{background:#f3f5f9}

/* Number line */
.line-area{
  margin-top:30px;
  border-top:1px solid #edf0f4;
  padding-top:25px;
}
.line-title{text-align:center;font-size:14px;color:#697386;margin-bottom:20px}
.line{
  position:relative;
  height:62px;
  margin:0 22px;
}
.axis{
  position:absolute;left:0;right:0;top:31px;height:4px;
  background:#d4d9e3;border-radius:3px;
}
.tick-row{
  position:absolute;left:0;right:0;top:20px;
  display:flex;justify-content:space-between;
}
.tick{height:25px;width:2px;background:#9da6b6}
.marker{
  position:absolute;
  top:20px;
  width:18px;height:18px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#4e6ed7;
  border:4px solid #fff;
  box-shadow:0 0 0 2px #4e6ed7;
  pointer-events:none;
}
.marker-number{
  position:absolute;
  top:-7px;
  transform:translate(-50%,-100%);
  font-size:13px;font-weight:700;color:#4e6ed7;
  white-space:nowrap;
}
.labels{
  display:flex;
  justify-content:space-between;
  margin:0 22px;
  color:#7b8494;
  font-size:12px;
}

/* Responsive */
@media(max-width:650px){
  .app{padding:18px 12px 30px}
  .card{padding:20px 14px}
  .digit{width:58px;height:72px;font-size:40px}
  .number{gap:5px}
  .equals{font-size:26px;padding-bottom:23px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  input[type=range]{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <h1>Place Value</h1>
  <p class="subtitle">Click a digit. Then move it and see what happens.</p>

  <div class="card">

    <div class="number-area">
      <div class="number" id="number"></div>
      <div class="value-line" id="valueLine"></div>
    </div>

    <div class="breakdown">
      <div class="breakdown-title">Each digit has a different value because of its position.</div>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="controls">
      <span class="control-label" id="controlLabel">Change the number</span>
      <input id="slider" type="range" min="0" max="9999" value="4725">
      <button class="btn" id="newBtn">New number</button>
    </div>

    <div class="line-area">
      <div class="line-title">Where is your number?</div>
      <div class="line" id="line">
        <div class="axis"></div>
        <div class="tick-row" id="ticks"></div>
        <div class="marker" id="marker"></div>
        <div class="marker-number" id="markerNumber"></div>
      </div>
      <div class="labels" id="labels"></div>
    </div>

  </div>
</div>

<script>
(function(){
  let number = 4725;
  let selected = null;

  const numberEl=document.getElementById("number");
  const valueLine=document.getElementById("valueLine");
  const tiles=document.getElementById("tiles");
  const slider=document.getElementById("slider");
  const controlLabel=document.getElementById("controlLabel");
  const marker=document.getElementById("marker");
  const markerNumber=document.getElementById("markerNumber");
  const ticks=document.getElementById("ticks");
  const labels=document.getElementById("labels");

  const places=["ones","tens","hundreds","thousands"];
  const format=n=>n.toLocaleString("en-US");

  function renderNumber(){
    const s=String(number).padStart(4,"0");
    numberEl.innerHTML="";
    [...s].forEach((ch,i)=>{
      const power=3-i;
      const wrap=document.createElement("div");
      wrap.className="digit-wrap";

      const btn=document.createElement("button");
      btn.className="digit"+(selected===i?" selected":"");
      btn.textContent=ch;
      btn.onclick=()=>{
        selected=i;
        const digit=Number(ch);
        const placeValue=Math.pow(10,power);
        controlLabel.textContent="Change the "+places[power]+" digit";
        valueLine.innerHTML=digit+" × "+format(placeValue)+" = <strong>"+format(digit*placeValue)+"</strong>";
        renderNumber();
        renderTiles();
      };

      const label=document.createElement("div");
      label.className="place";
      label.textContent=selected===i?places[power]:"";

      wrap.appendChild(btn);
      wrap.appendChild(label);
      numberEl.appendChild(wrap);

      if(i===s.length-1)return;
      const eq=document.createElement("div");
      eq.className="equals";
      eq.textContent="";
    });

    if(selected===null){
      valueLine.innerHTML="The number is <strong>"+format(number)+"</strong>";
    }
  }

  function renderTiles(){
    const s=String(number).padStart(4,"0");
    tiles.innerHTML="";
    for(let i=0;i<4;i++){
      const power=3-i;
      const digit=Number(s[i]);
      const tile=document.createElement("div");
      tile.className="tile"+(selected===i?" active":"");
      tile.innerHTML=
        '<div class="digit-small">'+digit+'</div>'+
        '<div class="place-small">'+places[power]+'</div>'+
        '<div class="amount">'+format(digit*Math.pow(10,power))+'</div>';
      tile.onclick=()=>{
        selected=i;
        const pv=Math.pow(10,power);
        controlLabel.textContent="Change the "+places[power]+" digit";
        valueLine.innerHTML=digit+" × "+format(pv)+" = <strong>"+format(digit*pv)+"</strong>";
        renderNumber();renderTiles();
      };
      tiles.appendChild(tile);
    }
  }

  function renderLine(){
    const pct=(number/9999)*100;
    marker.style.left=pct+"%";
    markerNumber.style.left=pct+"%";
    markerNumber.textContent=format(number);

    ticks.innerHTML="";
    labels.innerHTML="";
    for(let i=0;i<=10;i++){
      const t=document.createElement("div");
      t.className="tick";
      ticks.appendChild(t);
      const l=document.createElement("span");
      l.textContent=format(Math.round(i*999.9));
      labels.appendChild(l);
    }
  }

  function setNumber(n){
    number=Math.max(0,Math.min(9999,Math.round(n)));
    slider.value=number;
    selected=null;
    controlLabel.textContent="Change the number";
    renderNumber();
    renderTiles();
    renderLine();
  }

  slider.oninput=()=>setNumber(Number(slider.value));

  document.getElementById("newBtn").onclick=()=>{
    setNumber(Math.floor(Math.random()*9000)+100);
  };

  setNumber(number);
})();
</script>
</body>
</html>
