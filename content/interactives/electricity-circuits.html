<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electricity & Simple Circuits</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8f5;color:#17211b;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1100px,96vw);margin:22px auto 30px}
h1{margin:0 0 6px;font-size:clamp(27px,4vw,42px)}
.intro{margin:0 0 16px;color:#58635b;font-size:16px}
.stage{background:#fff;border:1px solid #dce3dc;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(20,35,25,.06)}
canvas{display:block;width:100%;height:min(58vw,570px);min-height:390px;background:#fbfcfa}
.controls{padding:16px 20px 20px;border-top:1px solid #e5e9e5}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{border:1px solid #cfd8d0;background:#fff;padding:11px 16px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#f0f4f1}
button.active{background:#e9f2eb;border-color:#9db9a2}
.readout{margin-top:14px;padding:11px 13px;border-radius:10px;background:#f1f5f1;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>Electricity & Simple Circuits</h1>
<p class="intro">Close the switch and watch electricity travel around the complete circuit to light the bulb.</p>
<div class="stage">
<canvas id="c"></canvas>
<div class="controls">
<div class="row">
<button id="switchBtn">Close the switch</button>
<button id="bulbBtn">Add a bulb</button>
<button id="reset">Reset</button>
</div>
<div class="readout" id="readout">The circuit is open, so there is no complete path for electricity.</div>
</div>
</div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const switchBtn=document.getElementById('switchBtn'),bulbBtn=document.getElementById('bulbBtn');
const reset=document.getElementById('reset'),readout=document.getElementById('readout');
let W=900,H=500,D=1,closed=false,bulbs=1,t=0;

function resize(){
 const r=canvas.getBoundingClientRect();
 D=Math.min(2,devicePixelRatio||1); W=Math.max(700,r.width); H=Math.max(390,r.height);
 canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);
}
addEventListener('resize',resize);resize();

function update(){
 switchBtn.textContent=closed?'Open the switch':'Close the switch';
 switchBtn.classList.toggle('active',closed);
 if(!closed) readout.textContent='The circuit is open, so there is no complete path for electricity.';
 else if(bulbs===1) readout.textContent='The circuit is complete. Electricity can travel around the loop and the bulb lights.';
 else readout.textContent='The circuit is complete. Electricity travels around the loop and both bulbs share the electrical energy.';
}
switchBtn.onclick=()=>{closed=!closed;update()};
bulbBtn.onclick=()=>{bulbs=bulbs===1?2:1;bulbBtn.textContent=bulbs===1?'Add a bulb':'Remove a bulb';update()};
reset.onclick=()=>{closed=false;bulbs=1;bulbBtn.textContent='Add a bulb';update()};
update();

function line(a,b,c,d){
 ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();
}
function battery(x,y){
 ctx.save();
 ctx.strokeStyle='#33433a';ctx.lineWidth=7;ctx.lineCap='round';
 line(x-12,y-24,x-12,y+24);line(x+12,y-13,x+12,y+13);
 ctx.fillStyle='#33433a';ctx.font='bold 15px Arial';ctx.fillText('battery',x-30,y+48);
 ctx.restore();
}
function bulb(x,y,on,small=false){
 ctx.save();
 const r=small?31:38;
 if(on){
   const g=ctx.createRadialGradient(x,y,8,x,y,r*2.2);
   g.addColorStop(0,'rgba(255,205,52,.55)');g.addColorStop(1,'rgba(255,205,52,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fill();
 }
 ctx.strokeStyle='#4d5b52';ctx.lineWidth=3;
 ctx.fillStyle=on?'#ffd34f':'#dfe5df';
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.strokeStyle=on?'#a46c20':'#68756d';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(x-10,y+7);ctx.lineTo(x+10,y-7);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x-10,y-7);ctx.lineTo(x+10,y+7);ctx.stroke();
 ctx.fillStyle='#56625a';ctx.font='bold 14px Arial';ctx.fillText('bulb',x-15,y+r+22);
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#fbfcfa';ctx.fillRect(0,0,W,H);
 const cy=H*.47,left=W*.16,right=W*.84,top=cy-145,bottom=cy+145;
 const bx=left+15, by=cy;
 const bulbXs=bulbs===1?[W*.63]:[W*.55,W*.72];

 // wires
 ctx.strokeStyle=closed?'#3f7f55':'#75827a';ctx.lineWidth=7;ctx.lineCap='round';
 ctx.beginPath();
 ctx.moveTo(bx,by);ctx.lineTo(bx,top);ctx.lineTo(bulbXs[0]-45,top);
 ctx.stroke();
 for(let i=0;i<bulbXs.length;i++){
   const x=bulbXs[i];
   ctx.beginPath();ctx.moveTo(x+45,top);ctx.lineTo(right,top);ctx.lineTo(right,bottom);ctx.lineTo(bx,bottom);ctx.lineTo(bx,by);ctx.stroke();
   if(i<bulbXs.length-1){
     // second bulb is placed on the top wire between first and right
     ctx.strokeStyle=closed?'#3f7f55':'#75827a';
     ctx.beginPath();ctx.moveTo(bulbXs[i]+45,top);ctx.lineTo(bulbXs[i+1]-45,top);ctx.stroke();
   }
   break;
 }
 // redraw clean top routing for bulbs
 ctx.strokeStyle=closed?'#3f7f55':'#75827a';ctx.lineWidth=7;
 ctx.beginPath();ctx.moveTo(bx,top);ctx.lineTo(bulbXs[0]-45,top);ctx.stroke();
 for(let i=0;i<bulbXs.length-1;i++){ctx.beginPath();ctx.moveTo(bulbXs[i]+45,top);ctx.lineTo(bulbXs[i+1]-45,top);ctx.stroke();}
 ctx.beginPath();ctx.moveTo(bulbXs[bulbXs.length-1]+45,top);ctx.lineTo(right,top);ctx.lineTo(right,bottom);ctx.lineTo(bx,bottom);ctx.lineTo(bx,by);ctx.stroke();

 // switch gap
 const swx=right, swy=bottom;
 // cover part of lower-right wire with switch visual
 ctx.fillStyle='#fbfcfa';ctx.fillRect(right-70,bottom-20,140,40);
 ctx.strokeStyle=closed?'#3f7f55':'#75827a';ctx.lineWidth=6;
 ctx.beginPath();ctx.moveTo(right-55,bottom);ctx.lineTo(right-12,bottom);ctx.stroke();
 ctx.beginPath();
 if(closed) ctx.moveTo(right-12,bottom),ctx.lineTo(right+35,bottom);
 else ctx.moveTo(right-12,bottom),ctx.lineTo(right+27,bottom-25);
 ctx.stroke();
 ctx.beginPath();ctx.moveTo(right+35,bottom);ctx.lineTo(right+55,bottom);ctx.stroke();
 ctx.fillStyle='#56625a';ctx.font='bold 14px Arial';ctx.fillText('switch',right-25,bottom+35);

 // battery
 battery(bx,by);

 // current particles/arrows only if circuit is closed
 if(closed){
   const pts=[];
   for(let i=0;i<18;i++){
     const q=((t*.13+i/18)%1);
     let px,py;
     if(q<.25){const z=q/.25;px=bx+(right-bx)*z;py=top}
     else if(q<.5){const z=(q-.25)/.25;px=right;py=top+(bottom-top)*z}
     else if(q<.75){const z=(q-.5)/.25;px=right-(right-bx)*z;py=bottom}
     else {const z=(q-.75)/.25;px=bx;py=bottom-(bottom-by)*z}
     pts.push([px,py]);
   }
   ctx.fillStyle='#d18b32';pts.forEach(([px,py])=>{ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill()});
   ctx.fillStyle='#3f7f55';ctx.font='bold 15px Arial';ctx.fillText('electricity moving around the complete path',W/2-135,H-35);
 }else{
   ctx.fillStyle='#69756e';ctx.font='bold 15px Arial';ctx.fillText('no complete path → no current',W/2-105,H-35);
 }

 bulbXs.forEach((x,i)=>bulb(x,top,closed,true));

 ctx.fillStyle='#253229';ctx.font='bold 17px Arial';
 ctx.fillText(closed?'Complete circuit':'Open circuit',W/2-58,70);

 t+=.016;requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
