<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matter & Its Changes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f8fc;color:#172033}
.wrap{min-height:100vh;padding:24px;display:flex;justify-content:center;align-items:center}
.playground{width:min(1120px,100%);background:#fff;border:1px solid #e4e7ef;border-radius:24px;padding:28px;box-shadow:0 10px 35px rgba(20,30,55,.08)}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
h1{margin:0 0 6px;font-size:28px}.sub{color:#667085;font-size:16px}
.state{font-size:25px;font-weight:700;padding:12px 18px;border-radius:14px;background:#f1f4ff;white-space:nowrap}
.stage{height:430px;border:1px solid #e4e7ef;border-radius:20px;background:#fafbfe;position:relative;overflow:hidden}
.beaker{position:absolute;left:50%;top:50%;transform:translate(-50%,-45%);width:min(680px,78%);height:290px;border:5px solid #8c96aa;border-top:0;border-radius:0 0 34px 34px;overflow:hidden;background:rgba(255,255,255,.55)}
.liquid{position:absolute;left:0;right:0;bottom:0;height:52%;background:rgba(91,157,232,.14);transition:height .3s}
.particles{position:absolute;inset:15px}
.p{position:absolute;width:14px;height:14px;border-radius:50%;background:#4f63d8;box-shadow:0 1px 4px rgba(40,50,90,.25);transition:left .18s,top .18s,transform .18s}
.marks{position:absolute;right:14px;top:12px;bottom:12px;width:38px;display:flex;flex-direction:column;justify-content:space-between;color:#8a93a5;font-size:12px}
.controls{margin-top:22px;border:1px solid #e4e7ef;border-radius:18px;padding:18px 20px}
.control-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.temp{font-size:22px}
input[type=range]{width:100%}
.scale{display:flex;justify-content:space-between;color:#667085;font-size:12px;margin-top:6px}
.readout{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.readout span{padding:10px 15px;border:1px solid #e4e7ef;border-radius:12px;background:#fff;font-size:17px;font-weight:700}
.question{margin-top:18px;padding:17px 20px;border-radius:16px;background:#fff8e8;border:1px solid #f2dfad;font-size:18px}
button{border:0;border-radius:10px;padding:9px 14px;background:#172033;color:#fff;font-weight:700;cursor:pointer;margin-left:8px}
.answer{width:90px;padding:8px;border:1px solid #cbd2e1;border-radius:9px;font-size:17px}
.feedback{font-weight:700;margin-left:8px}
@media(max-width:700px){
.wrap{padding:10px}.playground{padding:17px;border-radius:18px}
.top{flex-direction:column;align-items:flex-start}.state{font-size:21px}
.stage{height:350px}.beaker{width:84%;height:230px}
}
</style>
</head>
<body>
<div class="wrap">
<main class="playground">
  <div class="top">
    <div>
      <h1>Matter changes with temperature</h1>
      <div class="sub">Move the temperature and watch the particles change how they move.</div>
    </div>
    <div class="state" id="state">SOLID</div>
  </div>

  <section class="stage">
    <div class="beaker">
      <div class="liquid" id="liquid"></div>
      <div class="particles" id="particles"></div>
    </div>
    <div class="marks"><span>high</span><span></span><span></span><span>low</span></div>
  </section>

  <section class="controls">
    <div class="control-head">
      <span>Temperature</span>
      <span class="temp"><span id="temp">-20</span>°C</span>
    </div>
    <input id="temperature" type="range" min="-20" max="120" value="-20">
    <div class="scale"><span>-20°C</span><span>0°C</span><span>100°C</span><span>120°C</span></div>
  </section>

  <div class="readout">
    <span id="motion">Particles: tightly packed</span>
    <span id="shape">Keeps its shape</span>
    <span id="volume">Keeps its volume</span>
  </div>

  <div class="question">
    If the temperature is raised above 100°C, what happens?
    <input class="answer" id="answer" type="text" placeholder="state">
    <button id="check">Check</button>
    <span class="feedback" id="feedback"></span>
  </div>
</main>
</div>

<script>
const tempEl=document.getElementById('temperature');
const particleBox=document.getElementById('particles');
const stateEl=document.getElementById('state');
const tempText=document.getElementById('temp');
const motion=document.getElementById('motion');
const shape=document.getElementById('shape');
const volume=document.getElementById('volume');
const liquid=document.getElementById('liquid');

const count=48;
const particles=[];
for(let i=0;i<count;i++){
  const p=document.createElement('div');
  p.className='p';
  particleBox.appendChild(p);
  particles.push({
    el:p,
    x:Math.random(),
    y:Math.random(),
    vx:(Math.random()-.5),
    vy:(Math.random()-.5),
    phase:Math.random()*Math.PI*2
  });
}

function stateAt(t){
  if(t<0)return 'SOLID';
  if(t<100)return 'LIQUID';
  return 'GAS';
}

function updateText(t,s){
  tempText.textContent=t;
  stateEl.textContent=s;

  if(s==='SOLID'){
    motion.textContent='Particles: tightly packed, vibrating';
    shape.textContent='Keeps its shape';
    volume.textContent='Keeps its volume';
    liquid.style.height='52%';
  }else if(s==='LIQUID'){
    motion.textContent='Particles: close, sliding past each other';
    shape.textContent='Takes the shape of its container';
    volume.textContent='Keeps its volume';
    liquid.style.height='52%';
  }else{
    motion.textContent='Particles: far apart and moving freely';
    shape.textContent='Fills its container';
    volume.textContent='Spreads out';
    liquid.style.height='0%';
  }
}

function arrangeByState(s){
  const w=particleBox.clientWidth,h=particleBox.clientHeight;
  particles.forEach((q,i)=>{
    if(s==='SOLID'){
      const cols=8, rows=6;
      const col=i%cols,row=Math.floor(i/cols);
      q.x=(.08+col*.115);
      q.y=(.25+row*.095);
      q.vx=(Math.random()-.5)*.001;
      q.vy=(Math.random()-.5)*.001;
    }else if(s==='LIQUID'){
      q.x=.06+Math.random()*.88;
      q.y=.48+Math.random()*.43;
      q.vx=(Math.random()-.5)*.004;
      q.vy=(Math.random()-.5)*.004;
    }else{
      q.x=.03+Math.random()*.94;
      q.y=.03+Math.random()*.94;
      q.vx=(Math.random()-.5)*.006;
      q.vy=(Math.random()-.5)*.006;
    }
  });
}

let currentState='';
function renderState(){
  const t=+tempEl.value;
  const s=stateAt(t);
  updateText(t,s);
  if(s!==currentState){
    currentState=s;
    arrangeByState(s);
  }
}

function animate(){
  const t=+tempEl.value;
  const s=stateAt(t);
  const speed=Math.max(.2,(t+20)/140);
  const w=particleBox.clientWidth,h=particleBox.clientHeight;

  particles.forEach((q,i)=>{
    if(s==='SOLID'){
      const cols=8,rows=6;
      const targetX=.08+(i%cols)*.115;
      const targetY=.25+Math.floor(i/cols)*.095;
      const vibration=(t+20)/20*.0018;
      q.x=targetX+Math.sin(Date.now()/90+q.phase)*vibration;
      q.y=targetY+Math.cos(Date.now()/105+q.phase)*vibration;
    }else if(s==='LIQUID'){
      q.x+=q.vx*speed;
      q.y+=q.vy*speed;
      if(q.x<.04||q.x>.94)q.vx*=-1;
      if(q.y<.47||q.y>.92)q.vy*=-1;
      q.vx+=(Math.random()-.5)*.00035;
      q.vy+=(Math.random()-.5)*.00035;
      const max=.005+(t/100)*.004;
      q.vx=Math.max(-max,Math.min(max,q.vx));
      q.vy=Math.max(-max,Math.min(max,q.vy));
    }else{
      q.x+=q.vx*speed*1.5;
      q.y+=q.vy*speed*1.5;
      if(q.x<.02){q.x=.02;q.vx=Math.abs(q.vx)}
      if(q.x>.96){q.x=.96;q.vx=-Math.abs(q.vx)}
      if(q.y<.02){q.y=.02;q.vy=Math.abs(q.vy)}
      if(q.y>.96){q.y=.96;q.vy=-Math.abs(q.vy)}
    }

    q.el.style.left=(q.x*w)+'px';
    q.el.style.top=(q.y*h)+'px';
  });

  requestAnimationFrame(animate);
}

tempEl.addEventListener('input',renderState);
window.addEventListener('resize',renderState);

document.getElementById('check').onclick=()=>{
  const a=document.getElementById('answer').value.trim().toLowerCase();
  document.getElementById('feedback').textContent =
    a==='gas' ? '✓ Correct!' : 'Try again';
};

renderState();
animate();
</script>
</body>
</html>
