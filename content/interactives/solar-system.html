<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar System — Interactive</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8f5;color:#17211b;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1200px,96vw);margin:22px auto 28px}
h1{margin:0 0 5px;font-size:clamp(28px,4vw,42px)}
.intro{margin:0 0 15px;color:#58635b}
.stage{background:#fff;border:1px solid #dce3dc;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(20,35,25,.06)}
canvas{display:block;width:100%;height:min(62vw,650px);min-height:430px;background:#050914}
.controls{padding:15px 20px 19px;border-top:1px solid #e5e9e5}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
label{font-weight:700}
input[type=range]{width:min(360px,70vw)}
button{border:1px solid #cfd8d0;background:#fff;padding:10px 15px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
button:hover{background:#f0f4f1}
.readout{margin-top:12px;padding:11px 13px;border-radius:10px;background:#f1f5f1;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>Our Solar System</h1>
<p class="intro">Explore how the planets move around the Sun. Drag the speed and click a planet to learn about it.</p>
<div class="stage">
<canvas id="space"></canvas>
<div class="controls">
  <div class="row">
    <label for="speed">Orbit speed</label>
    <input id="speed" type="range" min="0" max="2" step=".01" value=".65">
    <span id="speedVal">Normal</span>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>
  <div class="readout" id="readout">The Sun is at the center. The planets orbit it because of gravity.</div>
</div>
</div>
</div>

<script>
const c=document.getElementById('space'),ctx=c.getContext('2d');
const speed=document.getElementById('speed'),speedVal=document.getElementById('speedVal');
const pause=document.getElementById('pause'),reset=document.getElementById('reset'),readout=document.getElementById('readout');
let W=1000,H=600,D=1,paused=false,t=0,hover=-1;
const planets=[
 {name:"Mercury",a:.105,size:4.5,period:.24,color:"#aaa28e",info:"Mercury is the closest planet to the Sun and the smallest planet."},
 {name:"Venus",a:.17,size:7,color:"#d9ae72",period:.615,info:"Venus has a very thick atmosphere and is the hottest planet."},
 {name:"Earth",a:.235,size:8,period:1,color:"#4d8ac7",info:"Earth is our home and has liquid water on its surface."},
 {name:"Mars",a:.30,size:6,period:1.88,color:"#c9674e",info:"Mars is a cold, rocky planet often called the Red Planet."},
 {name:"Jupiter",a:.43,size:15,period:11.86,color:"#c99d73",info:"Jupiter is the largest planet in our Solar System."},
 {name:"Saturn",a:.57,size:13,period:29.45,color:"#d8c28e",info:"Saturn is famous for its large system of icy rings."},
 {name:"Uranus",a:.70,size:10,period:84,color:"#82c9c9",info:"Uranus is an ice giant that rotates on a strongly tilted axis."},
 {name:"Neptune",a:.82,size:10,period:164.8,color:"#4e72c7",info:"Neptune is the farthest major planet from the Sun."}
];

function resize(){
 const r=c.getBoundingClientRect(); D=Math.min(2,devicePixelRatio||1);
 W=Math.max(720,r.width);H=Math.max(430,r.height);
 c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);
}
addEventListener('resize',resize);resize();

function currentSpeed(){
 const v=+speed.value;
 speedVal.textContent=v===0?"Stopped":v<.45?"Slow":v<1.2?"Normal":"Fast";
 return v;
}
speed.oninput=currentSpeed;
pause.onclick=()=>{paused=!paused;pause.textContent=paused?"Play":"Pause"};
reset.onclick=()=>{speed.value=.65;paused=false;t=0;pause.textContent="Pause";currentSpeed();readout.textContent="The Sun is at the center. The planets orbit it because of gravity.";};

function starfield(){
 ctx.fillStyle="#050914";ctx.fillRect(0,0,W,H);
 let seed=17;
 for(let i=0;i<130;i++){
   seed=(seed*9301+49297)%233280;
   const x=(seed/233280)*W;
   seed=(seed*9301+49297)%233280;
   const y=(seed/233280)*H;
   const r=.4+(seed%12)/20;
   ctx.fillStyle="rgba(255,255,255,.65)";
   ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
 }
}

function draw(){
 starfield();
 const cx=W*.5,cy=H*.52;
 const scale=Math.min(W,H)*.43;

 // Orbit paths
 planets.forEach(p=>{
   ctx.strokeStyle="rgba(210,220,235,.16)";ctx.lineWidth=1;
   ctx.beginPath();ctx.ellipse(cx,cy,scale*p.a,scale*p.a*.52,0,0,Math.PI*2);ctx.stroke();
 });

 // Sun
 const sunR=Math.min(43,scale*.075);
 const glow=ctx.createRadialGradient(cx,cy,5,cx,cy,sunR*3);
 glow.addColorStop(0,"rgba(255,218,78,.48)");
 glow.addColorStop(1,"rgba(255,218,78,0)");
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,sunR*3,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ffd84d";ctx.beginPath();ctx.arc(cx,cy,sunR,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff1a1";ctx.beginPath();ctx.arc(cx-sunR*.25,cy-sunR*.25,sunR*.27,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="bold 15px Arial";ctx.fillText("Sun",cx-14,cy+sunR+24);

 // planets
 planets.forEach((p,i)=>{
   const ang=(t/(p.period*.55)+i*.73);
   const x=cx+Math.cos(ang)*scale*p.a;
   const y=cy+Math.sin(ang)*scale*p.a*.52;
   p.x=x;p.y=y;
   // Saturn ring
   if(p.name==="Saturn"){
     ctx.save();ctx.translate(x,y);ctx.rotate(-.25);
     ctx.strokeStyle="#c8b783";ctx.lineWidth=3;
     ctx.beginPath();ctx.ellipse(0,0,p.size*1.75,p.size*.62,0,0,Math.PI*2);ctx.stroke();
     ctx.restore();
   }
   ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,p.size,0,Math.PI*2);ctx.fill();
   if(p.name==="Earth"){
     ctx.fillStyle="#67a86e";ctx.beginPath();ctx.arc(x-2,y-2,3,0,Math.PI*2);ctx.fill();
   }
   ctx.fillStyle="#eef2f7";ctx.font="12px Arial";ctx.fillText(p.name,x+p.size+5,y+4);
 });

 // interaction
 if(hover>=0){
   const p=planets[hover];
   ctx.fillStyle="rgba(255,255,255,.96)";
   const boxW=245,boxH=72, bx=Math.min(W-boxW-18,Math.max(18,p.x+18)), by=Math.max(18,p.y-80);
   ctx.fillRect(bx,by,boxW,boxH);
   ctx.strokeStyle="#cbd4cf";ctx.strokeRect(bx,by,boxW,boxH);
   ctx.fillStyle="#17211b";ctx.font="bold 15px Arial";ctx.fillText(p.name,bx+12,by+21);
   ctx.font="12px Arial";wrap(p.info,bx+12,by+40,boxW-24,15);
 }
 if(!paused)t+=.018*currentSpeed();
 requestAnimationFrame(draw);
}
function wrap(text,x,y,maxWidth,lineHeight){
 const words=text.split(" ");let line="";
 for(const word of words){
   const test=line?line+" "+word:word;
   if(ctx.measureText(test).width>maxWidth){
     ctx.fillText(line,x,y);line=word;y+=lineHeight;
   }else line=test;
 }
 ctx.fillText(line,x,y);
}
c.addEventListener("mousemove",e=>{
 const r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 hover=-1;
 planets.forEach((p,i)=>{if(Math.hypot(mx-p.x,my-p.y)<Math.max(14,p.size+7))hover=i});
 c.style.cursor=hover>=0?"pointer":"default";
});
c.addEventListener("click",()=>{
 if(hover>=0){
   const p=planets[hover];
   readout.textContent=p.name+": "+p.info;
 }
});
draw();
</script>
</body>
</html>
