<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Transformation — Pedal to Light</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f8fa;color:#20242a}
.app{min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid #e1e5e9;padding:22px 28px 15px}
h1{margin:0;font-size:28px}.sub{margin:7px 0 0;color:#626a73;font-size:15px}
main{padding:20px 28px 28px;display:flex;flex-direction:column;gap:16px}
.stage{background:#fff;border:1px solid #dfe3e8;border-radius:16px;overflow:hidden}
canvas{width:100%;height:500px;display:block;background:#fbfcfd}
.controls{background:#fff;border:1px solid #dfe3e8;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.control{flex:1;min-width:300px}
label{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:8px}
input{width:100%}
button{border:0;border-radius:9px;padding:10px 17px;background:#20242a;color:#fff;font-weight:700;cursor:pointer}
.question{font-size:18px;font-weight:700}
.hint{font-size:14px;color:#69717b;line-height:1.45}
.readout{font-size:14px;color:#626a73}.readout b{color:#20242a}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Energy & Its Transformations</h1>
<p class="sub">Pedal the bike. Watch your energy move through the system and become light.</p>
</header>
<main>
<div class="stage"><canvas id="c"></canvas></div>
<div class="controls">
  <div class="control">
    <label>How fast are you pedaling? <span id="speedVal">50</span>%</label>
    <input id="speed" type="range" min="0" max="100" value="50">
  </div>
  <button id="stop">Stop pedaling</button>
  <button id="reset">Reset</button>
  <div class="readout">Bulb brightness: <b id="brightness">50%</b></div>
</div>
<div class="question" id="question">Can you make the bulb brighter?</div>
<div class="hint">Try moving the slider slowly, then quickly. Notice that energy doesn't disappear — it is transformed from one form to another.</div>
</main>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const speed=document.getElementById('speed'),speedVal=document.getElementById('speedVal');
const brightness=document.getElementById('brightness');
let W=1000,H=500,dpr=1,wheel=0,bulb=0,running=true,last=performance.now();

function resize(){
 const r=c.getBoundingClientRect(); dpr=devicePixelRatio||1;
 W=Math.max(700,r.width);H=500;c.width=W*dpr;c.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
window.addEventListener('resize',resize);

function line(x1,y1,x2,y2){
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function arrow(x1,y1,x2,y2,label){
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 const a=Math.atan2(y2-y1,x2-x1),s=8;
 ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-s*Math.cos(a-.5),y2-s*Math.sin(a-.5));ctx.lineTo(x2-s*Math.cos(a+.5),y2-s*Math.sin(a+.5));ctx.closePath();ctx.fill();
 ctx.font='bold 13px Arial';ctx.fillText(label,x2+8,y2+4);
}
function energyDots(x1,y1,x2,y2,count,phase){
 for(let i=0;i<count;i++){
   const t=((i/count+phase)%1),x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
   ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
 }
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const bikeX=W*.24, bikeY=335, wheelR=72;
 const genX=W*.55, genY=295;
 const bulbX=W*.78, bulbY=190;
 const s=Number(speed.value), b=bulb;

 // Title inside experiment
 ctx.fillStyle='#20242a';ctx.font='bold 20px Arial';
 ctx.fillText('Watch one transformation lead to the next',28,38);
 ctx.font='14px Arial';ctx.fillStyle='#69717b';
 ctx.fillText('The dots represent energy moving through the system.',28,61);

 // floor
 ctx.strokeStyle='#dfe3e7';ctx.lineWidth=2;line(45,420,W-45,420);

 // Bike
 ctx.strokeStyle='#30363d';ctx.fillStyle='#30363d';ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(bikeX-70,bikeY, wheelR,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.arc(bikeX+70,bikeY,wheelR,0,Math.PI*2);ctx.stroke();
 line(bikeX-70,bikeY,bikeX,bikeY-72);line(bikeX,bikeY-72,bikeX+70,bikeY);line(bikeX-70,bikeY,bikeX+70,bikeY);
 line(bikeX,bikeY-72,bikeX,bikeY-115);
 ctx.beginPath();ctx.arc(bikeX,bikeY-122,9,0,Math.PI*2);ctx.fill();
 // rider head/body
 ctx.beginPath();ctx.arc(bikeX-4,bikeY-165,13,0,Math.PI*2);ctx.fill();
 line(bikeX-4,bikeY-150,bikeX,bikeY-115);
 // crank
 ctx.beginPath();ctx.arc(bikeX,bikeY-72,7,0,Math.PI*2);ctx.stroke();
 ctx.save();ctx.translate(bikeX,bikeY-72);ctx.rotate(wheel);
 line(0,0,0,38);ctx.restore();

 ctx.font='bold 15px Arial';ctx.fillStyle='#20242a';ctx.fillText('Your body',bikeX-50,455);
 ctx.font='13px Arial';ctx.fillStyle='#69717b';ctx.fillText('chemical energy',bikeX-62,473);

 // generator
 ctx.strokeStyle='#30363d';ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(genX,genY,48,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.arc(genX,genY,18,0,Math.PI*2);ctx.stroke();
 ctx.save();ctx.translate(genX,genY);ctx.rotate(wheel*.7);line(-28,0,28,0);line(0,-28,0,28);ctx.restore();
 ctx.fillStyle='#20242a';ctx.font='bold 15px Arial';ctx.fillText('Generator',genX-39,370);
 ctx.font='13px Arial';ctx.fillStyle='#69717b';ctx.fillText('electrical energy',genX-52,388);

 // bulb
 ctx.strokeStyle='#30363d';ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(bulbX,bulbY+45);ctx.lineTo(bulbX,bulbY+83);ctx.stroke();
 ctx.beginPath();ctx.arc(bulbX,bulbY,43,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.arc(bulbX,bulbY,18,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='#555c64';ctx.lineWidth=2;
 line(bulbX-14,bulbY+8,bulbX,bulbY-10);line(bulbX,bulbY-10,bulbX+14,bulbY+8);
 if(b>0){
   // Warm yellow glow makes the energy transformation visually obvious.
   const glow=Math.max(0.12, b/100);
   const grad=ctx.createRadialGradient(bulbX,bulbY,10,bulbX,bulbY,88);
   grad.addColorStop(0,'rgba(255,235,40,'+(0.80*glow)+')');
   grad.addColorStop(.45,'rgba(255,220,0,'+(0.34*glow)+')');
   grad.addColorStop(1,'rgba(255,220,0,0)');
   ctx.fillStyle=grad;
   ctx.beginPath();ctx.arc(bulbX,bulbY,88,0,Math.PI*2);ctx.fill();

   ctx.fillStyle='rgba(255,225,25,'+(0.45+0.5*glow)+')';
   ctx.beginPath();ctx.arc(bulbX,bulbY,39,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#fff8a0';
   ctx.beginPath();ctx.arc(bulbX-10,bulbY-11,11,0,Math.PI*2);ctx.fill();
 }
 ctx.fillStyle='#20242a';ctx.font='bold 15px Arial';ctx.fillText('Light',bulbX-18,345);
 ctx.font='13px Arial';ctx.fillStyle='#69717b';ctx.fillText('light energy',bulbX-30,363);

 // Connecting wires
 ctx.strokeStyle='#606870';ctx.lineWidth=3;
 line(bikeX+70,bikeY,genX-48,genY);
 line(genX+48,genY,bulbX,bulbY+43);

 // arrows and energy flow
 ctx.fillStyle='#20242a';ctx.strokeStyle='#20242a';ctx.lineWidth=2;
 arrow(bikeX+105,260,genX-70,245,'motion');
 arrow(genX+75,250,bulbX-65,205,'electricity');

 const count=Math.max(1,Math.round(s/12));
 energyDots(bikeX+75,bikeY-5,genX-52,genY-15,count,wheel/8);
 energyDots(genX+53,genY-12,bulbX-8,bulbY+34,count,wheel/11);

 // transformation statements
 ctx.font='bold 16px Arial';ctx.fillStyle='#20242a';
 ctx.fillText('chemical → motion',bikeX+15,115);
 ctx.fillText('motion → electrical',genX-65,115);
 ctx.fillText('electrical → light',bulbX-75,115);

 // state message — kept separate from the transformation labels so text never overlaps
 ctx.font='bold 16px Arial';
 ctx.fillStyle='#20242a';
 let state='';
 if(s===0) state='No pedaling → the system stops.';
 else if(s<40) state='Slow pedaling → dim light.';
 else if(s<75) state='Faster pedaling → brighter light.';
 else state='Fast pedaling → bright light.';
 ctx.fillText(state,28,145);
}
function tick(now){
 const dt=Math.min((now-last)/1000,.04);last=now;
 const target=running?Number(speed.value):0;
 wheel += target*.045*dt*60;
 const targetBulb=target;
 bulb += (targetBulb-bulb)*Math.min(1,dt*5);
 speedVal.textContent=speed.value;
 brightness.textContent=Math.round(bulb)+'%';
 draw();requestAnimationFrame(tick);
}
speed.addEventListener('input',()=>{running=true});
document.getElementById('stop').addEventListener('click',()=>{running=false});
document.getElementById('reset').addEventListener('click',()=>{speed.value=50;running=true;});
resize();requestAnimationFrame(tick);
</script>
</body>
</html>
