<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplication & Division</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#182033}
.app{max-width:1080px;margin:auto;padding:28px 24px 40px}
h1{font-size:28px;margin:0 0 6px}
.subtitle{margin:0 0 24px;color:#697386;font-size:15px}
.card{background:#fff;border:1px solid #e4e7ee;border-radius:22px;padding:28px;box-shadow:0 6px 24px rgba(25,35,60,.05)}
.equation{display:flex;justify-content:center;align-items:center;gap:12px;min-height:100px;flex-wrap:wrap}
.box{width:92px;height:82px;border:2px solid #dce1eb;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700}
.operator{font-size:32px;color:#8a93a5}
.result{font-size:42px;font-weight:700;color:#4e6ed7;min-width:100px;text-align:center}
.statement{text-align:center;color:#586276;font-size:17px;margin:12px 0 25px}
.statement strong{color:#182033}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #edf0f4;padding-top:23px}
.control{display:flex;align-items:center;gap:8px;color:#697386;font-size:14px}
input[type=range]{accent-color:#4e6ed7;cursor:pointer;width:270px}
.btn{border:1px solid #dce1eb;background:#fff;color:#263047;border-radius:10px;padding:9px 13px;font-weight:600;cursor:pointer}
.btn:hover{background:#f3f5f9}
.visual{margin-top:28px;border-top:1px solid #edf0f4;padding-top:25px}
.visual-title{text-align:center;font-size:14px;color:#697386;margin-bottom:18px}
.groups{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;min-height:120px}
.group{padding:10px;border:1px solid #e4e8ef;border-radius:14px;background:#fafbfc;min-width:88px;max-width:150px}
.group-label{text-align:center;font-size:12px;color:#7b8494;margin-bottom:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:#4e6ed7}
.division-note{text-align:center;margin-top:15px;font-size:14px;color:#697386}
.question{margin-top:28px;border-top:1px solid #edf0f4;padding-top:25px;text-align:center}
.question-text{font-size:18px;font-weight:700;margin-bottom:15px}
.answer-row{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.answer{width:130px;padding:10px;border:1px solid #d8dde7;border-radius:10px;text-align:center}
.feedback{height:22px;margin-top:10px;font-weight:700}
@media(max-width:650px){
 .app{padding:18px 12px 30px}.card{padding:20px 14px}
 .box{width:68px;height:66px;font-size:32px}.result{font-size:34px;min-width:75px}
 input[type=range]{width:100%}.group{min-width:72px}
}
</style>
</head>
<body>
<div class="app">
<h1>Multiplication & Division</h1>
<p class="subtitle">Change the groups. Watch multiplication and division change with them.</p>

<div class="card">
  <div class="equation">
    <div class="box" id="groupsNum">4</div>
    <div class="operator">×</div>
    <div class="box" id="eachNum">3</div>
    <div class="operator">=</div>
    <div class="result" id="result">12</div>
  </div>

  <div class="statement" id="statement">
    <strong>4 groups</strong> of <strong>3</strong> make <strong>12</strong>.
  </div>

  <div class="controls">
    <div class="control">
      Groups
      <input id="groupsSlider" type="range" min="1" max="8" value="4">
    </div>
    <div class="control">
      In each
      <input id="eachSlider" type="range" min="1" max="10" value="3">
    </div>
    <button class="btn" id="random">Try another</button>
  </div>

  <div class="visual">
    <div class="visual-title">Build the groups</div>
    <div class="groups" id="groups"></div>
    <div class="division-note" id="divisionNote">
      12 shared into 4 equal groups gives 3 in each group.
    </div>
  </div>

  <div class="question">
    <div class="question-text" id="question">If there are 5 groups with 4 in each, how many altogether?</div>
    <div class="answer-row">
      <input class="answer" id="answer" inputmode="numeric" placeholder="Your answer">
      <button class="btn" id="check">Check</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>
</div>

<script>
(function(){
  let g=4, e=3, score=0;
  const gs=document.getElementById("groupsSlider");
  const es=document.getElementById("eachSlider");
  const groupsEl=document.getElementById("groups");
  const result=document.getElementById("result");
  const statement=document.getElementById("statement");
  const divisionNote=document.getElementById("divisionNote");
  const question=document.getElementById("question");
  const feedback=document.getElementById("feedback");

  function render(){
    g=Number(gs.value); e=Number(es.value);
    const total=g*e;
    document.getElementById("groupsNum").textContent=g;
    document.getElementById("eachNum").textContent=e;
    result.textContent=total;
    statement.innerHTML="<strong>"+g+" groups</strong> of <strong>"+e+"</strong> make <strong>"+total+"</strong>.";
    divisionNote.textContent=total+" shared into "+g+" equal groups gives "+e+" in each group.";

    groupsEl.innerHTML="";
    for(let i=0;i<g;i++){
      const group=document.createElement("div");
      group.className="group";
      group.innerHTML='<div class="group-label">Group '+(i+1)+'</div><div class="dots"></div>';
      const dots=group.querySelector(".dots");
      for(let j=0;j<e;j++){
        const dot=document.createElement("span");
        dot.className="dot";
        dots.appendChild(dot);
      }
      groupsEl.appendChild(group);
    }
  }

  gs.oninput=render; es.oninput=render;

  document.getElementById("random").onclick=function(){
    gs.value=Math.floor(Math.random()*8)+1;
    es.value=Math.floor(Math.random()*10)+1;
    render(); newQuestion();
  };

  function newQuestion(){
    const a=Math.floor(Math.random()*7)+2;
    const b=Math.floor(Math.random()*8)+2;
    question.dataset.answer=a*b;
    question.innerHTML="If there are <strong>"+a+" groups</strong> with <strong>"+b+" in each</strong>, how many altogether?";
    document.getElementById("answer").value="";
    feedback.textContent="";
  }

  document.getElementById("check").onclick=function(){
    const val=Number(document.getElementById("answer").value);
    if(val===Number(question.dataset.answer)){
      feedback.textContent="Correct! 🎉";
      score++;
      setTimeout(newQuestion,700);
    }else{
      feedback.textContent="Not quite — try again.";
    }
  };

  newQuestion();
  gs.value=4; es.value=3; render();
})();
</script>
</body>
</html>
