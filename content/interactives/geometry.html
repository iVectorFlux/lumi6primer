<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Playground</title>
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#182033}
*{box-sizing:border-box}
body{overflow:auto}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px}
h1{margin:0;font-size:28px}.sub{margin:6px 0 22px;color:#697386}
.panel{background:#fff;border:1px solid #e1e5ec;border-radius:20px;padding:20px}
canvas{display:block;width:100%;height:430px;background:#fbfcfe;border:1px solid #e5e8ef;border-radius:16px}
.info{text-align:center;font-size:18px;padding:18px 5px 5px}.info b{color:#4e68d0}
.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding-top:18px;margin-top:15px;border-top:1px solid #edf0f4}
button{font:inherit;border:1px solid #d9deea;background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}
button.selected{background:#eef2ff;border-color:#9cacdf}
label{font-size:14px;color:#697386;display:flex;align-items:center;gap:8px}
input{width:190px;accent-color:#4e68d0}
.metrics{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.metric{background:#f8f9fc;border:1px solid #e8ebf1;border-radius:11px;padding:10px 20px;text-align:center}
.metric b{display:block;font-size:18px}.metric span{font-size:12px;color:#788294}
</style>
</head>
<body>
<div class="wrap">
<h1>Geometry</h1>
<p class="sub">Change the shape, turn it, and see what stays the same.</p>
<div class="panel">
<canvas id="canvas"></canvas>
<div id="info" class="info"></div>
<div class="controls" id="shapes">
<button data-shape="square" class="selected">Square</button>
<button data-shape="rectangle">Rectangle</button>
<button data-shape="triangle">Triangle</button>
<button data-shape="circle">Circle</button>
</div>
<div class="controls">
<label>Size <input id="size" type="range" min="60" max="200" value="150"></label>
<label>Turn <input id="angle" type="range" min="0" max="360" value="0"></label>
<button id="reset">Reset</button>
</div>
<div id="metrics" class="metrics"></div>
</div>
</div>
<script>
(function(){
var canvas=document.getElementById("canvas");
var ctx=canvas.getContext("2d");
var shape="square",size=150,angle=0;

function resize(){
 var r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;
 canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw();
}
function draw(){
 var w=canvas.clientWidth,h=canvas.clientHeight,cx=w/2,cy=h/2,s=size;
 ctx.clearRect(0,0,w,h);
 ctx.strokeStyle="#e8ebf2";ctx.lineWidth=1;
 for(var x=0;x<w;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
 for(var y=0;y<h;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
 ctx.save();ctx.translate(cx,cy);ctx.rotate(angle*Math.PI/180);
 ctx.fillStyle="#667ed8";ctx.strokeStyle="#435fc5";ctx.lineWidth=3;
 ctx.beginPath();
 if(shape==="square"){ctx.rect(-s/2,-s/2,s,s)}
 else if(shape==="rectangle"){ctx.rect(-s*.72/2,-s*.48/2,s*.72,s*.48)}
 else if(shape==="circle"){ctx.arc(0,0,s/2,0,Math.PI*2)}
 else {ctx.moveTo(0,-s/2);ctx.lineTo(s*.58,s/2);ctx.lineTo(-s*.58,s/2);ctx.closePath()}
 ctx.fill();ctx.stroke();ctx.restore();
 var facts={square:["4 equal sides","4"],rectangle:["2 pairs of equal sides","4"],triangle:["3 sides","3"],circle:["a curved edge","0"]}[shape];
 document.getElementById("info").innerHTML="A <b>"+shape+"</b> has <b>"+facts[0]+"</b> and <b>"+facts[1]+" corners</b>.";
 document.getElementById("metrics").innerHTML='<div class="metric"><b>'+facts[1]+'</b><span>Corners</span></div><div class="metric"><b>'+angle+'°</b><span>Turn</span></div><div class="metric"><b>'+size+'</b><span>Size</span></div>';
}
document.querySelectorAll("#shapes button").forEach(function(b){b.onclick=function(){shape=b.getAttribute("data-shape");document.querySelectorAll("#shapes button").forEach(function(x){x.classList.remove("selected")});b.classList.add("selected");draw()}})
document.getElementById("size").oninput=function(){size=+this.value;draw()}
document.getElementById("angle").oninput=function(){angle=+this.value;draw()}
document.getElementById("reset").onclick=function(){shape="square";size=150;angle=0;document.getElementById("size").value=150;document.getElementById("angle").value=0;document.querySelectorAll("#shapes button").forEach(function(x){x.classList.toggle("selected",x.getAttribute("data-shape")==="square")});draw()}
window.onresize=resize;resize();
})();
</script>
</body>
</html>
