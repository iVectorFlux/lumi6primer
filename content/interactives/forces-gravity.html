<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forces, Motion & Gravity</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f8fc;color:#172033}
.wrap{min-height:100vh;padding:22px;display:flex;justify-content:center;align-items:center}
.playground{width:min(1140px,100%);background:#fff;border:1px solid #e4e7ef;border-radius:24px;padding:28px;box-shadow:0 10px 35px rgba(20,30,55,.08)}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}
h1{margin:0 0 6px;font-size:28px}.sub{color:#667085;font-size:16px}
.state{font-size:22px;font-weight:700;padding:11px 17px;border-radius:13px;background:#f1f4ff;white-space:nowrap}
canvas{display:block;width:100%;height:430px;border:1px solid #e4e7ef;border-radius:20px;background:#fbfcff}
.controls{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.control{border:1px solid #e4e7ef;border-radius:17px;padding:17px 19px}
.head{display:flex;justify-content:space-between;font-weight:700;margin-bottom:11px}.value{font-size:19px}
input[type=range]{width:100%}.scale{display:flex;justify-content:space-between;color:#667085;font-size:12px;margin-top:5px}
.actions{text-align:center;margin-top:16px}button{border:0;border-radius:10px;padding:10px 17px;background:#172033;color:#fff;font-weight:700;cursor:pointer}
.metrics{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.metrics span{padding:9px 13px;border:1px solid #e4e7ef;border-radius:11px;background:#fff;font-weight:700}
.question{margin-top:17px;padding:16px 19px;border-radius:15px;background:#fff8e8;border:1px solid #f2dfad;font-size:17px}
.answer{width:105px;padding:7px 9px;border:1px solid #cbd2e1;border-radius:8px;font-size:16px;margin:0 6px}
.feedback{font-weight:700;margin-left:5px}
@media(max-width:700px){.wrap{padding:10px}.playground{padding:17px}.top{flex-direction:column;align-items:flex-start}.controls{grid-template-columns:1fr}canvas{height:360px}}
</style>
</head>
<body>
<div class="wrap"><main class="playground">
<div class="top">
  <div><h1>Push the ball. Change gravity.</h1><div class="sub">Try the same push with different gravity and compare the path.</div></div>
  <div class="state" id="state">READY</div>
</div>

<canvas id="canvas"></canvas>

<div class="controls">
  <div class="control">
    <div class="head"><span>Push force</span><span class="value" id="pushVal">5</span></div>
    <input id="push" type="range" min="0" max="10" step=".1" value="5">
    <div class="scale"><span>none</span><span>strong</span></div>
  </div>
  <div class="control">
    <div class="head"><span>Gravity</span><span class="value" id="gravityVal">5</span></div>
    <input id="gravity" type="range" min="0" max="10" step=".1" value="5">
    <div class="scale"><span>none</span><span>strong</span></div>
  </div>
</div>

<div class="actions"><button id="reset">Reset experiment</button></div>
<div class="metrics">
<span id="speed">Speed: 0</span>
<span id="time">Time: 0.0 s</span>
<span id="distance">Horizontal distance: 0</span>
</div>

<div class="question">If gravity increases while the push stays the same, does the ball fall faster?
<input class="answer" id="answer" placeholder="yes/no"><button id="check">Check</button>
<span class="feedback" id="feedback"></span></div>
</main></div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const push=document.getElementById('push'),gravity=document.getElementById('gravity');
let W=0,H=0,dpr=1;
let x=0,y=0,vx=0,vy=0,t=0,last=performance.now(),running=true;
let trail=[];

function resize(){
  const r=canvas.getBoundingClientRect(); dpr=window.devicePixelRatio||1;
  W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!running && trail.length===0) reset();
}
function reset(){
  x=W*.09; y=H*.28; vx=0; vy=0; t=0; running=true; trail=[];
  last=performance.now();
}
function arrow(x1,y1,x2,y2,label,color){
  const a=Math.atan2(y2-y1,x2-x1),len=Math.hypot(x2-x1,y2-y1);
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-12*Math.cos(a-.45),y2-12*Math.sin(a-.45));
  ctx.lineTo(x2-12*Math.cos(a+.45),y2-12*Math.sin(a+.45));ctx.closePath();ctx.fill();
  ctx.font='bold 14px Arial';ctx.fillText(label,x2+8,y2+5);
}
function draw(){
  ctx.clearRect(0,0,W,H);

  // horizon / launch line
  ctx.strokeStyle='#b8c0cf';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(30,H-55);ctx.lineTo(W-30,H-55);ctx.stroke();
  ctx.fillStyle='#667085';ctx.font='13px Arial';
  ctx.fillText('path of the ball',34,H-32);

  // previous trajectory
  if(trail.length>1){
    ctx.strokeStyle='#b6bfd4';ctx.lineWidth=3;ctx.beginPath();
    trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  }

  // ball
  ctx.fillStyle='#4f63d8';ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();

  const f=+push.value,g=+gravity.value;
  const forceLen=f*11;
  if(f>.05) arrow(x,y-2,x+forceLen,y-2,'push','#d85443');

  const velLen=Math.min(Math.abs(vx)*12,110);
  if(velLen>3) arrow(x,y+32,x+velLen,y+32,'velocity','#4f63d8');

  const gravLen=18+g*9;
  if(g>.05) arrow(x+2,y+24,x+2,y+24+gravLen,'gravity','#333b4d');

  ctx.fillStyle='#667085';ctx.font='bold 13px Arial';
  ctx.fillText('START',Math.max(8,W*.09-22),H-72);
  ctx.fillText('Higher gravity = steeper downward pull',W-255,30);

  document.getElementById('pushVal').textContent=f.toFixed(1);
  document.getElementById('gravityVal').textContent=g.toFixed(1);
  document.getElementById('speed').textContent='Speed: '+(Math.hypot(vx,vy)*1.8).toFixed(1);
  document.getElementById('time').textContent='Time: '+t.toFixed(1)+' s';
  document.getElementById('distance').textContent='Horizontal distance: '+Math.max(0,Math.round(x-W*.09));
  document.getElementById('state').textContent=running?'IN MOTION':'EXPERIMENT COMPLETE';
}
function animate(now){
  const dt=Math.min((now-last)/1000,.03);last=now;
  if(running){
    const f=+push.value,g=+gravity.value;
    // Same push always accelerates horizontally; gravity changes the vertical fall.
    vx += f*0.95*dt;
    vy += g*1.15*dt;
    x += vx*dt*7.5;
    y += vy*dt*7.5;
    t += dt;

    if(t>.03 && (trail.length===0 || Math.hypot(x-trail[trail.length-1].x,y-trail[trail.length-1].y)>5))
      trail.push({x,y});

    if(y>H-78 || x>W-55){
      running=false;
    }
  }
  draw();requestAnimationFrame(animate);
}
push.addEventListener('input',()=>{if(!running)reset()});
gravity.addEventListener('input',()=>{if(!running)reset()});
document.getElementById('reset').onclick=reset;
document.getElementById('check').onclick=()=>{
 const a=document.getElementById('answer').value.trim().toLowerCase();
 document.getElementById('feedback').textContent=a==='yes'?'✓ Correct!':'Try again';
};
window.addEventListener('resize',resize);
resize();reset();requestAnimationFrame(animate);
</script>
</body>
</html>
