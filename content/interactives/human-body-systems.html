<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Body Systems — Interactive</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#17211b;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1120px,96vw);margin:22px auto 30px}h1{margin:0 0 6px;font-size:clamp(28px,4vw,42px)}
.intro{margin:0 0 16px;color:#59645d}.stage{background:#fff;border:1px solid #dce3dc;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(20,35,25,.06)}
canvas{display:block;width:100%;height:min(62vw,650px);min-height:470px;background:#fcfcfa}
.controls{padding:15px 20px 20px;border-top:1px solid #e5e9e5}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
button{border:1px solid #cfd8d0;background:#fff;padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer}button.active{background:#e8f1ea;border-color:#91ad98}
.read{margin-top:12px;padding:11px 13px;border-radius:10px;background:#f1f5f1;font-weight:700}
</style></head>
<body><div class="wrap">
<h1>Human Body Systems</h1>
<p class="intro">Choose a system. See where it is, what it does, and how it works with another system.</p>
<div class="stage"><canvas id="c"></canvas><div class="controls"><div class="row" id="buttons"></div><div class="read" id="read"></div></div></div>
</div>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d"),buttons=document.getElementById("buttons"),read=document.getElementById("read");
let W=900,H=540,D=1,selected="Circulatory",t=0;
const data={
 Circulatory:{color:"#d34b58",desc:"The heart pumps blood. Blood carries oxygen and nutrients to cells and carries wastes away.",partner:"Respiratory",partnerText:"The lungs put oxygen into the blood, and the heart carries that oxygen around the body."},
 Respiratory:{color:"#5e91c9",desc:"The lungs bring oxygen into the body and remove carbon dioxide when you breathe out.",partner:"Circulatory",partnerText:"The lungs add oxygen to the blood so the heart can deliver it to cells."},
 Digestive:{color:"#d18a4a",desc:"The digestive system breaks food into nutrients that the body can absorb and use.",partner:"Circulatory",partnerText:"Nutrients from the intestine enter the blood and travel to cells."},
 Nervous:{color:"#8c69b0",desc:"The brain, spinal cord and nerves send messages that help the body sense, think and respond.",partner:"Muscular",partnerText:"Nerves tell muscles when and how to contract so the body can move."},
 Muscular:{color:"#c76870",desc:"Muscles contract to move the body. Some muscles also keep organs working.",partner:"Skeletal",partnerText:"Muscles pull on bones to create movement at joints."},
 Skeletal:{color:"#ad9b79",desc:"Bones support and protect the body. Together they form the skeleton.",partner:"Muscular",partnerText:"Muscles pull on bones to move the body."}
};
Object.keys(data).forEach(n=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>{selected=n;update();};buttons.appendChild(b)});
function update(){[...buttons.children].forEach(b=>b.classList.toggle("active",b.textContent===selected));read.textContent=data[selected].desc}
update();
function resize(){let r=c.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=Math.max(700,r.width);H=Math.max(470,r.height);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener("resize",resize);resize();

function line(points,w,color,alpha=1){ctx.save();ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.lineWidth=w;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore()}
function circle(x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function organAlpha(n){return n===selected?1:.10}

function drawPerson(x){
 // simple but recognizable body
 ctx.save();ctx.fillStyle="#e9b28f";circle(x,82,42,"#e9b28f"); // head
 ctx.fillRect(x-17,121,34,38);
 line([[x-58,155],[x-91,270],[x-83,385]],24,"#e9b28f");
 line([[x+58,155],[x+91,270],[x+83,385]],24,"#e9b28f");
 ctx.fillStyle="#e9b28f";ctx.beginPath();ctx.moveTo(x-58,150);ctx.lineTo(x+58,150);ctx.lineTo(x+49,340);ctx.lineTo(x-49,340);ctx.closePath();ctx.fill();
 line([[x-24,335],[x-40,470]],30,"#e9b28f");line([[x+24,335],[x+40,470]],30,"#e9b28f");
 ctx.restore();
}

function skeleton(x,a){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=data.Skeletal.color;ctx.lineWidth=7;
 line([[x,130],[x,335]],7,data.Skeletal.color,a);line([[x-43,165],[x+43,165]],7,data.Skeletal.color,a);
 line([[x-35,335],[x-42,470]],7,data.Skeletal.color,a);line([[x+35,335],[x+42,470]],7,data.Skeletal.color,a);
 for(let y=180;y<305;y+=18)line([[x-34,y],[x+34,y]],3,data.Skeletal.color,a);ctx.restore()}
function muscles(x,a){line([[x-43,180],[x-43,320]],19,data.Muscular.color,a);line([[x+43,180],[x+43,320]],19,data.Muscular.color,a);line([[x-38,220],[x+38,220]],15,data.Muscular.color,a);line([[x-25,345],[x-40,460]],18,data.Muscular.color,a);line([[x+25,345],[x+40,460]],18,data.Muscular.color,a)}
function lungs(x,a){circle(x-29,210,34,data.Respiratory.color,a);circle(x+29,210,34,data.Respiratory.color,a);line([[x,150],[x,220]],7,data.Respiratory.color,a);line([[x,150],[x-29,180]],5,data.Respiratory.color,a);line([[x,150],[x+29,180]],5,data.Respiratory.color,a)}
function heart(x,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=data.Circulatory.color;ctx.beginPath();ctx.moveTo(x,278);ctx.bezierCurveTo(x-42,245,x-35,218,x-9,230);ctx.bezierCurveTo(x,235,x,245,x,245);ctx.bezierCurveTo(x+10,220,x+40,235,x+9,278);ctx.closePath();ctx.fill();ctx.restore();
 line([[x,255],[x-65,290],[x-45,335],[x+20,360],[x+58,310],[x+30,275]],3,data.Circulatory.color,a)}
function digestive(x,a){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=data.Digestive.color;ctx.lineWidth=11;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(x+10,270);ctx.bezierCurveTo(x-45,260,x-45,300,x+35,300);ctx.bezierCurveTo(x+55,300,x+50,325,x-30,325);ctx.bezierCurveTo(x-50,325,x-45,350,x+25,350);ctx.stroke();ctx.restore()}
function nervous(x,a){line([[x,105],[x,170],[x,245],[x,330],[x,450]],5,data.Nervous.color,a);for(let y=180;y<390;y+=50){line([[x,y],[x-75,y-25]],3,data.Nervous.color,a);line([[x,y],[x+75,y-25]],3,data.Nervous.color,a)}circle(x,82,34,data.Nervous.color,a)}

function selectedAnimation(x){
 const d=data[selected];
 if(selected==="Circulatory"){let r=1+Math.sin(t*5)*.12;circle(x,255,30*r,d.color,.28);line([[x-70,290],[x-45,335],[x+20,360],[x+58,310]],4,d.color,.8)}
 if(selected==="Respiratory"){let pulse=1+.08*Math.sin(t*3);circle(x-29,210,34*pulse,d.color,.55);circle(x+29,210,34*pulse,d.color,.55)}
 if(selected==="Digestive"){let q=(Math.sin(t*2)+1)/2;circle(x-10+q*22,325,7,d.color,1)}
 if(selected==="Nervous"){for(let i=0;i<4;i++){let q=(t*90+i*55)%150;line([[x,145+q],[x+55,120+q]],3,d.color,.75)}}
 if(selected==="Muscular"){let q=1+.10*Math.sin(t*5);line([[x-43,180],[x-43,320]],19*q,d.color,.8);line([[x+43,180],[x+43,320]],19*q,d.color,.8)}
 if(selected==="Skeletal"){circle(x,250,55+4*Math.sin(t*3),d.color,.18)}
}

function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle="#fcfcfa";ctx.fillRect(0,0,W,H);
 const x=W*.38, panelX=W*.66;
 drawPerson(x);
 // draw all systems, but selected is strong and others are only faint context
 skeleton(x,organAlpha("Skeletal"));muscles(x,organAlpha("Muscular"));lungs(x,organAlpha("Respiratory"));heart(x,organAlpha("Circulatory"));digestive(x,organAlpha("Digestive"));nervous(x,organAlpha("Nervous"));
 selectedAnimation(x);
 // labels around body
 ctx.fillStyle="#59645d";ctx.font="bold 13px Arial";ctx.textAlign="center";
 ctx.fillText("SELECT A SYSTEM",x,H-18);
 // explanation area
 ctx.textAlign="left";ctx.fillStyle="#17211b";ctx.font="bold 23px Arial";ctx.fillText(selected,panelX,95);
 ctx.font="15px Arial";wrap(data[selected].desc,panelX,128,280,22);
 ctx.fillStyle="#59645d";ctx.font="bold 15px Arial";ctx.fillText("WORKS WITH",panelX,245);
 ctx.fillStyle="#17211b";ctx.font="bold 18px Arial";ctx.fillText(data[selected].partner,panelX,272);
 ctx.font="14px Arial";wrap(data[selected].partnerText,panelX,300,280,21);
 ctx.fillStyle="#59645d";ctx.font="bold 14px Arial";ctx.fillText("Watch the highlighted system",panelX,410);
 ctx.font="14px Arial";ctx.fillText("animate to show its job.",panelX,432);
 t+=.02;requestAnimationFrame(draw);
}
function wrap(s,x,y,max,lineH){let words=s.split(" "),lineText="";for(const w of words){let test=lineText?lineText+" "+w:w;if(ctx.measureText(test).width>max&&lineText){ctx.fillText(lineText,x,y);lineText=w;y+=lineH}else lineText=test}if(lineText)ctx.fillText(lineText,x,y)}
draw();
</script>
</body></html>
