<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moon Phases — Accurate Interactive Model</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#17211b;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1180px,96vw);margin:22px auto 30px}h1{margin:0 0 6px;font-size:clamp(28px,4vw,42px)}
.intro{margin:0 0 16px;color:#59645d}.stage{background:#fff;border:1px solid #dce3dc;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(20,35,25,.06)}
canvas{display:block;width:100%;height:min(61vw,640px);min-height:440px;background:#07101d}
.controls{padding:16px 20px 20px;border-top:1px solid #e5e9e5}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
input{width:min(440px,72vw)}button{padding:10px 16px;border:1px solid #cfd8d0;background:#fff;border-radius:10px;font-weight:700;cursor:pointer}
.read{margin-top:13px;background:#f1f5f1;border-radius:10px;padding:12px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>Moon Phases</h1>
<p class="intro">The Moon does not change shape. The Sun always lights half of it — as the Moon orbits Earth, we see different parts of that lit half.</p>
<div class="stage">
<canvas id="c"></canvas>
<div class="controls"><div class="row">
<label><b>Move the Moon around Earth</b></label>
<input id="angle" type="range" min="0" max="360" step=".1" value="180">
<button id="play">Pause</button><button id="reset">Full Moon</button>
</div>
<div class="read" id="read">Full Moon — the Moon is opposite the Sun, so the hemisphere facing Earth is illuminated.</div>
</div></div>
</div>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d"),angle=document.getElementById("angle"),play=document.getElementById("play"),reset=document.getElementById("reset"),read=document.getElementById("read");
let W=1000,H=600,D=1,running=false,drag=false;
function resize(){const r=c.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=Math.max(720,r.width);H=Math.max(440,r.height);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener("resize",resize);resize();

const info=[
["New Moon","The Moon is between the Sun and Earth. Its sunlit side faces away from Earth."],
["Waxing Crescent","A small part of the sunlit hemisphere is visible from Earth."],
["First Quarter","About half of the sunlit hemisphere is visible."],
["Waxing Gibbous","More than half of the sunlit hemisphere is visible."],
["Full Moon","The Moon is opposite the Sun. The hemisphere facing Earth is fully illuminated."],
["Waning Gibbous","More than half is visible, but the visible lit part is getting smaller."],
["Third Quarter","About half of the sunlit hemisphere is visible."],
["Waning Crescent","Only a small part of the sunlit hemisphere is visible."]
];
function phase(a){a=((a%360)+360)%360;let i=Math.floor((a+22.5)/45)%8;return info[i]}
function stars(){ctx.fillStyle="#07101d";ctx.fillRect(0,0,W,H);let s=19;for(let i=0;i<125;i++){s=(s*9301+49297)%233280;let x=s/233280*W;s=(s*9301+49297)%233280;let y=s/233280*H;ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.arc(x,y,.45+(s%12)/18,0,Math.PI*2);ctx.fill()}}
function sun(x,y,r){let g=ctx.createRadialGradient(x,y,r*.3,x,y,r*2.5);g.addColorStop(0,"rgba(255,220,70,.5)");g.addColorStop(1,"rgba(255,220,70,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.5,0,7);ctx.fill();ctx.fillStyle="#ffd84d";ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle="#fff1a0";ctx.beginPath();ctx.arc(x-r*.25,y-r*.25,r*.24,0,7);ctx.fill()}
function earth(x,y,r){ctx.fillStyle="#2779b8";ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle="#62a568";ctx.beginPath();ctx.arc(x-r*.28,y-r*.2,r*.33,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+r*.27,y+r*.27,r*.25,0,7);ctx.fill();ctx.fillStyle="rgba(255,255,255,.5)";ctx.beginPath();ctx.arc(x-r*.3,y+r*.28,r*.12,0,7);ctx.fill()}
function moonPhase(x,y,r,a){
  // Accurate apparent phase in a 2D orbital plane.
  // Sun is to the left. a=0 is Moon on Sun side (New Moon), a=180 is Full Moon.
  // The illuminated fraction visible from Earth is (1-cos(a))/2.
  const c=Math.cos(a);
  const lit=(1-c)/2;
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();
  ctx.fillStyle="#222b35";ctx.fillRect(x-r-2,y-r-2,2*r+4,2*r+4);
  ctx.fillStyle="#e4e5e3";
  // Construct illuminated portion as intersection of the Moon disk with the Sun-facing hemisphere.
  // Terminator is an ellipse; its projected horizontal radius is |cos(phase)|*r.
  const side = a<Math.PI ? -1 : 1;
  const rx=Math.abs(Math.cos(a))*r;
  ctx.beginPath();
  if(a<Math.PI){
    // waxing: right-facing visible crescent grows
    ctx.arc(x,y,r,-Math.PI/2,Math.PI/2,false);
    ctx.ellipse(x,y,rx,r,0,Math.PI/2,-Math.PI/2,true);
  }else{
    // waning: left-facing visible light shrinks
    ctx.arc(x,y,r,Math.PI/2,3*Math.PI/2,false);
    ctx.ellipse(x,y,rx,r,0,3*Math.PI/2,Math.PI/2,true);
  }
  ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.strokeStyle="#aeb8bd";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}
function draw(){
 stars();
 const ex=W*.43,ey=H*.53,orbit=Math.min(W,H)*.29;
 const sx=Math.max(75,W*.09),sy=ey,sr=Math.min(43,Math.min(W,H)*.075);
 // parallel sunlight rays
 ctx.strokeStyle="rgba(255,216,77,.28)";ctx.lineWidth=2;
 for(let q=-2;q<=2;q++){ctx.beginPath();ctx.moveTo(sx+sr+8,sy+q*42);ctx.lineTo(W*.91,sy+q*42);ctx.stroke()}
 sun(sx,sy,sr);
 ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.fillText("SUN",sx-16,sy+sr+25);
 // Earth orbit and Earth
 ctx.strokeStyle="rgba(230,240,255,.23)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ex,ey,orbit,0,7);ctx.stroke();
 earth(ex,ey,57);ctx.fillStyle="#fff";ctx.fillText("EARTH",ex-23,ey+82);
 const a=+angle.value*Math.PI/180,mx=ex+Math.cos(a)*orbit,my=ey+Math.sin(a)*orbit;
 // sunlight direction at Moon: show only a couple of arrows, not attached to the person/Earth.
 const dx=mx-sx,dy=my-sy,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
 ctx.strokeStyle="rgba(255,216,77,.8)";ctx.lineWidth=2.5;
 for(let off=-10;off<=10;off+=20){
   const px=sx+sr+12,py=sy+off, ex2=mx-ux*34,ey2=my-uy*34;
   ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(ex2,ey2);ctx.stroke();
   const ar=9,px2=ex2-ux*ar,py2=ey2-uy*ar;
   ctx.beginPath();ctx.moveTo(ex2,ey2);ctx.lineTo(px2-uy*5,py2+ux*5);ctx.lineTo(px2+uy*5,py2-ux*5);ctx.closePath();ctx.fillStyle="#ffd84d";ctx.fill();
 }
 moonPhase(mx,my,29,a);
 ctx.fillStyle="#fff";ctx.font="bold 13px Arial";ctx.fillText("MOON",mx-20,my+48);
 // line from Earth to Moon = what an observer sees
 ctx.setLineDash([5,5]);ctx.strokeStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(mx,my);ctx.stroke();ctx.setLineDash([]);
 // right-hand observation panel
 const px=W*.73,py=H*.45,pr=Math.min(82,H*.14);
 ctx.fillStyle="rgba(255,255,255,.96)";ctx.fillRect(px-115,py-145,230,260);
 ctx.fillStyle="#17211b";ctx.font="bold 15px Arial";ctx.fillText("From Earth",px-38,py-118);
 moonPhase(px,py,pr,a);
 const [nm,desc]=phase(+angle.value);
 ctx.fillStyle="#17211b";ctx.font="bold 15px Arial";ctx.fillText(nm,px-48,py+115);
 ctx.font="12px Arial";wrap(desc,px-99,py+140,198,15);
 read.textContent=nm+" — "+desc;
 if(running)angle.value=(+angle.value+.16)%360;
 requestAnimationFrame(draw);
}
function wrap(s,x,y,max,line){let words=s.split(" "),lineText="";for(const w of words){let test=lineText?lineText+" "+w:w;if(ctx.measureText(test).width>max){ctx.fillText(lineText,x,y);lineText=w;y+=line}else lineText=test}ctx.fillText(lineText,x,y)}
play.onclick=()=>{running=!running;play.textContent=running?"Pause":"Play"};
reset.onclick=()=>{running=false;play.textContent="Play";angle.value=180};
function pointer(e){const r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;const ex=W*.43,ey=H*.53,orbit=Math.min(W,H)*.29;let dx=mx-ex,dy=my-ey;if(Math.hypot(dx,dy)<orbit*1.28){let a=Math.atan2(dy,dx)*180/Math.PI;if(a<0)a+=360;angle.value=a}}
c.addEventListener("pointerdown",e=>{drag=true;c.setPointerCapture(e.pointerId);running=false;play.textContent="Play";pointer(e)});
c.addEventListener("pointermove",e=>{if(drag)pointer(e)});
c.addEventListener("pointerup",()=>drag=false);
draw();
</script>
</body></html>
