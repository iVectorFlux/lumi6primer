<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patterns & Relationships</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f8fc;
    color:#172033;
  }
  .wrap{
    min-height:100vh;
    padding:28px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .playground{
    width:min(1100px,100%);
    background:white;
    border:1px solid #e5e7ef;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 35px rgba(20,30,55,.08);
  }
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:24px;
  }
  h1{font-size:28px;margin:0 0 6px}
  .sub{font-size:16px;color:#667085}
  .rule{
    font-size:25px;
    font-weight:700;
    padding:12px 18px;
    border-radius:14px;
    background:#f1f4ff;
    white-space:nowrap;
  }
  .sequence{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin:18px 0 28px;
  }
  .term{
    width:100px;
    height:82px;
    border:2px solid #d9deea;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#fff;
    cursor:pointer;
    transition:.15s;
  }
  .term:hover{transform:translateY(-2px);border-color:#aeb8d5}
  .term.selected{border-color:#4f63d8;background:#f1f4ff}
  .term .n{font-size:28px;font-weight:700}
  .term .label{font-size:12px;color:#667085;margin-top:4px}
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:24px;
  }
  .control{
    border:1px solid #e5e7ef;
    border-radius:18px;
    padding:18px;
  }
  .control label{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    margin-bottom:12px;
  }
  input[type=range]{width:100%}
  .value{
    font-size:18px;
    font-weight:700;
  }
  .visual{
    border-radius:20px;
    background:#fafbfe;
    border:1px solid #e5e7ef;
    padding:24px;
  }
  .chart{
    height:290px;
    position:relative;
    border-left:2px solid #cbd2e1;
    border-bottom:2px solid #cbd2e1;
    margin:10px 8px 28px 42px;
  }
  .gridline{
    position:absolute;left:0;right:0;border-top:1px dashed #e3e6ee;
  }
  .points{
    position:absolute;inset:0;
  }
  .point{
    position:absolute;
    width:18px;height:18px;
    margin:-9px;
    border-radius:50%;
    background:#4f63d8;
    border:3px solid white;
    box-shadow:0 2px 7px rgba(30,40,80,.2);
  }
  .line{
    position:absolute;
    height:3px;
    background:#4f63d8;
    transform-origin:left center;
  }
  .axis-label{
    position:absolute;
    font-size:12px;
    color:#667085;
  }
  .axis-x{right:-4px;bottom:-25px}
  .axis-y{left:-34px;top:-5px}
  .readout{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    font-size:22px;
    font-weight:700;
  }
  .readout span{
    padding:9px 14px;
    background:white;
    border:1px solid #e5e7ef;
    border-radius:12px;
  }
  .question{
    margin-top:22px;
    padding:18px 20px;
    border-radius:16px;
    background:#fff8e8;
    border:1px solid #f2dfad;
    font-size:18px;
  }
  .question input{
    width:90px;
    font-size:18px;
    padding:8px 10px;
    border:1px solid #cbd2e1;
    border-radius:9px;
    margin:0 7px;
  }
  button{
    border:0;
    border-radius:10px;
    padding:9px 14px;
    font-weight:700;
    cursor:pointer;
    background:#172033;
    color:white;
  }
  #feedback{margin-left:10px;font-weight:700}
  @media(max-width:700px){
    .wrap{padding:12px}
    .playground{padding:18px;border-radius:18px}
    .top{align-items:flex-start;flex-direction:column}
    .controls{grid-template-columns:1fr}
    .term{width:78px;height:70px}
    .chart{margin-left:30px}
  }
</style>
</head>
<body>
<div class="wrap">
  <main class="playground">
    <div class="top">
      <div>
        <h1>Find the rule</h1>
        <div class="sub">Change the rule and watch the pattern grow.</div>
      </div>
      <div class="rule" id="rule">+ 3</div>
    </div>

    <div class="sequence" id="sequence"></div>

    <div class="controls">
      <div class="control">
        <label>Start with <span class="value" id="startVal">2</span></label>
        <input id="start" type="range" min="0" max="10" value="2">
      </div>
      <div class="control">
        <label>Add each time <span class="value" id="stepVal">3</span></label>
        <input id="step" type="range" min="1" max="8" value="3">
      </div>
    </div>

    <section class="visual">
      <div class="chart" id="chart">
        <div class="gridline" style="top:25%"></div>
        <div class="gridline" style="top:50%"></div>
        <div class="gridline" style="top:75%"></div>
        <div class="axis-label axis-x">term number →</div>
        <div class="axis-label axis-y">value</div>
        <div id="lines"></div>
        <div class="points" id="points"></div>
      </div>
      <div class="readout" id="readout"></div>
    </section>

    <div class="question">
      What comes next?
      <strong id="qSequence"></strong>
      <input id="answer" type="number">
      <button id="check">Check</button>
      <span id="feedback"></span>
    </div>
  </main>
</div>

<script>
const start=document.getElementById('start');
const step=document.getElementById('step');
const sequence=document.getElementById('sequence');
const chart=document.getElementById('chart');
const points=document.getElementById('points');
const lines=document.getElementById('lines');
const readout=document.getElementById('readout');
const rule=document.getElementById('rule');
const qSequence=document.getElementById('qSequence');

let selected=0, terms=[];

function render(){
  const s=+start.value, d=+step.value;
  document.getElementById('startVal').textContent=s;
  document.getElementById('stepVal').textContent=d;
  rule.textContent='+ '+d;

  terms=Array.from({length:8},(_,i)=>s+i*d);

  sequence.innerHTML='';
  terms.forEach((v,i)=>{
    const el=document.createElement('div');
    el.className='term'+(i===selected?' selected':'');
    el.innerHTML='<div class="n">'+v+'</div><div class="label">term '+(i+1)+'</div>';
    el.onclick=()=>{selected=i;render()};
    sequence.appendChild(el);
  });

  const max=Math.max(...terms,1);
  points.innerHTML='';
  lines.innerHTML='';
  const W=chart.clientWidth, H=chart.clientHeight;

  terms.forEach((v,i)=>{
    const x=(i/(terms.length-1))*100;
    const y=100-(v/max)*86-4;
    const p=document.createElement('div');
    p.className='point';
    p.style.left=x+'%';
    p.style.top=y+'%';
    points.appendChild(p);

    if(i>0){
      const prev=terms[i-1];
      const x1=(i-1)/(terms.length-1)*W;
      const y1=(100-(prev/max)*86-4)/100*H;
      const x2=i/(terms.length-1)*W;
      const y2=(100-(v/max)*86-4)/100*H;
      const dx=x2-x1, dy=y2-y1;
      const l=document.createElement('div');
      l.className='line';
      l.style.left=x1+'px';
      l.style.top=y1+'px';
      l.style.width=Math.sqrt(dx*dx+dy*dy)+'px';
      l.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';
      lines.appendChild(l);
    }
  });

  const v=terms[selected];
  readout.innerHTML='<span>Term '+(selected+1)+'</span><span>'+v+'</span><span>='+s+' + '+selected+' × '+d+'</span>';

  qSequence.textContent=terms.slice(0,4).join(', ')+' …';
  document.getElementById('feedback').textContent='';
  document.getElementById('answer').value='';
}
start.oninput=render;
step.oninput=render;
document.getElementById('check').onclick=()=>{
  const expected=terms[4];
  const a=+document.getElementById('answer').value;
  document.getElementById('feedback').textContent=a===expected?'✓ Correct!':'Try again';
};
window.addEventListener('resize',render);
render();
</script>
</body>
</html>
