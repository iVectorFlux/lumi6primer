# Build a Docker image, push to ECR, update the ECS task definition, and roll the ECS service.
#
# Run this manually (Actions → Deploy ECS → Run workflow) after GitHub secrets exist.
# It does not run on every push, so missing AWS keys will not fail CI.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                    e.g. ap-south-1
#   ECR_REPOSITORY                e.g. lumi6primer
#   ECS_CLUSTER
#   ECS_SERVICE
#   ECS_TASK_DEFINITION           e.g. lumi6primer-c4c6 (the task-definition family name)
#   ECS_CONTAINER_NAME            e.g. lumi6primer-c4c6 (the container name inside the task def)

name: Deploy ECS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'iVectorFlux/lumi6primer'
    steps:
      - name: Require AWS secrets
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          missing=
          [ -n "$AWS_REGION" ] || missing="$missing AWS_REGION"
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing="$missing AWS_ACCESS_KEY_ID"
          [ -n "$ECR_REPOSITORY" ] || missing="$missing ECR_REPOSITORY"
          [ -n "$ECS_CLUSTER" ] || missing="$missing ECS_CLUSTER"
          [ -n "$ECS_SERVICE" ] || missing="$missing ECS_SERVICE"
          if [ -n "$missing" ]; then
            echo "Add these GitHub Actions secrets before deploying:$missing"
            echo "Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image (linux/amd64 and linux/arm64)
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "$FULL_IMAGE" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --push .
          echo "image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION }}
        run: |
          if [ -n "$ECS_TASK_DEFINITION" ]; then
            TASK_DEF_ID="$ECS_TASK_DEFINITION"
            echo "Using ECS_TASK_DEFINITION secret: $TASK_DEF_ID"
          else
            echo "No ECS_TASK_DEFINITION secret — detecting from service..."
            # Dump full service JSON so we can find the task definition reliably
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --output json > service-description.json

            # Try multiple paths: top-level .taskDefinition, then PRIMARY deployment
            TASK_DEF_ID=$(python3 -c "
          import json
          svc = json.load(open('service-description.json'))
          s = svc.get('services', [{}])[0]
          # Path 1: top-level taskDefinition
          td = s.get('taskDefinition')
          if td and td != 'None':
              print(td)
          else:
              # Path 2: from the PRIMARY deployment
              for d in s.get('deployments', []):
                  if d.get('status') == 'PRIMARY' and d.get('taskDefinition'):
                      print(d['taskDefinition'])
                      break
              else:
                  # Path 3: from any deployment
                  for d in s.get('deployments', []):
                      if d.get('taskDefinition'):
                          print(d['taskDefinition'])
                          break
                  else:
                      # Debug: print available keys
                      import sys
                      print('DEBUG service keys:', list(s.keys()), file=sys.stderr)
                      print('DEBUG deployments:', json.dumps(s.get('deployments', [])[:2], indent=2, default=str), file=sys.stderr)
                      print('NONE')
          ")
            echo "Detected task definition: $TASK_DEF_ID"
            if [ "$TASK_DEF_ID" = "NONE" ] || [ -z "$TASK_DEF_ID" ]; then
              echo "::error::Could not detect task definition from service. Add ECS_TASK_DEFINITION secret with the task def family name."
              exit 1
            fi
          fi
          echo "Downloading task definition: $TASK_DEF_ID"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ID" \
            --query 'taskDefinition' \
            --output json > task-definition.json
          echo "Downloaded task definition successfully"
          python3 -c "
          import json, sys
          td = json.load(open('task-definition.json'))
          for key in ['taskDefinitionArn','revision','status','requiresAttributes',
                      'compatibilities','registeredAt','registeredBy','deregisteredAt']:
              td.pop(key, None)
          json.dump(td, open('clean-task-definition.json','w'), indent=2)
          print('Cleaned task definition written.')
          "

      - name: Update image in task definition
        env:
          ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          NEW_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          export CONTAINER="${ECS_CONTAINER_NAME:-$ECS_SERVICE}"
          echo "Updating container '$CONTAINER' to image: $NEW_IMAGE"
          python3 -c "
          import json, sys, os
          td = json.load(open('clean-task-definition.json'))
          container_name = os.environ.get('CONTAINER', '')
          new_image = os.environ['NEW_IMAGE']
          found = False
          for c in td.get('containerDefinitions', []):
              if c['name'] == container_name:
                  print(f\"Old image: {c['image']}\")
                  c['image'] = new_image
                  print(f\"New image: {c['image']}\")
                  found = True
                  break
          if not found:
              names = [c['name'] for c in td.get('containerDefinitions', [])]
              print(f'Container \"{container_name}\" not found. Available: {names}')
              if td.get('containerDefinitions'):
                  td['containerDefinitions'][0]['image'] = new_image
                  print(f\"Updated first container ({td['containerDefinitions'][0]['name']}) to {new_image}\")
          json.dump(td, open('new-task-definition.json','w'), indent=2)
          print('Task definition updated.')
          "

      - name: Register new task definition revision
        id: taskdef
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "New task definition: $NEW_ARN"
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service with new task definition
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          TASK_DEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          echo "Deploying task definition $TASK_DEF_ARN to $ECS_SERVICE..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --force-new-deployment \
            --output text
          echo "✅ Deployment triggered successfully!"
