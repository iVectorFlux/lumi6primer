# Build a Docker image, push to ECR, and roll the ECS service.
#
# Run this manually (Actions → Deploy ECS → Run workflow) after GitHub secrets exist.
# It does not run on every push, so missing AWS keys will not fail CI.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                    e.g. ap-south-1
#   ECR_REPOSITORY                e.g. lumi6primer
#   ECS_CLUSTER
#   ECS_SERVICE

name: Deploy ECS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'iVectorFlux/lumi6primer'
    steps:
      - name: Require AWS secrets
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          missing=
          [ -n "$AWS_REGION" ] || missing="$missing AWS_REGION"
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing="$missing AWS_ACCESS_KEY_ID"
          [ -n "$ECR_REPOSITORY" ] || missing="$missing ECR_REPOSITORY"
          [ -n "$ECS_CLUSTER" ] || missing="$missing ECS_CLUSTER"
          [ -n "$ECS_SERVICE" ] || missing="$missing ECS_SERVICE"
          if [ -n "$missing" ]; then
            echo "Add these GitHub Actions secrets before deploying:$missing"
            echo "Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Update ECS and Deploy
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          NEW_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          DEPLOYED=false

          echo "Attempting to fetch current task definition..."
          CURRENT_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text 2>/dev/null || echo "")

          if [ -n "$CURRENT_TASK_DEF_ARN" ] && [ "$CURRENT_TASK_DEF_ARN" != "None" ]; then
            if aws ecs describe-task-definition --task-definition "$CURRENT_TASK_DEF_ARN" --query "taskDefinition" > task-def.json 2>/dev/null; then
              node -e '
                const fs = require("fs");
                const def = JSON.parse(fs.readFileSync("task-def.json", "utf8"));
                delete def.taskDefinitionArn;
                delete def.revision;
                delete def.status;
                delete def.requiresAttributes;
                delete def.compatibilities;
                delete def.registeredAt;
                delete def.registeredBy;
                delete def.deregisteredAt;
                const newImage = process.env.NEW_IMAGE;
                if (Array.isArray(def.containerDefinitions) && def.containerDefinitions.length > 0) {
                  def.containerDefinitions[0].image = newImage;
                }
                fs.writeFileSync("new-task-def.json", JSON.stringify(def, null, 2));
              '
              NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query "taskDefinition.taskDefinitionArn" --output text 2>/dev/null || echo "")
              if [ -n "$NEW_TASK_DEF_ARN" ] && [ "$NEW_TASK_DEF_ARN" != "None" ]; then
                echo "Deploying with new task definition revision: $NEW_TASK_DEF_ARN"
                aws ecs update-service \
                  --cluster "$ECS_CLUSTER" \
                  --service "$ECS_SERVICE" \
                  --task-definition "$NEW_TASK_DEF_ARN" \
                  --force-new-deployment \
                  --output text
                DEPLOYED=true
              fi
            fi
          fi

          if [ "$DEPLOYED" != "true" ]; then
            echo "Triggering ECS force-new-deployment (rolling latest image)..."
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force-new-deployment \
              --output text
          fi

          echo "Waiting for new ECS tasks to become healthy and reach steady state..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
          echo "Deployment successful: new container is healthy and live!"

      - name: Invalidate CloudFront cache (if configured)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          echo "Creating CloudFront invalidation for /* ..."
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
